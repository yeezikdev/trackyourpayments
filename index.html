<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C47D3">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Track Your Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar fissa a sinistra su desktop, bottom nav su mobile; contenuto a card con gerarchia "riepilogo prima del dettaglio". */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#141725; --ink-2:#464C64; --muted:#767C94; --line:#E1E4EE; --line-2:#EEF0F5;
  --accent:#2C47D3; --accent-ink:#FFFFFF; --accent-soft:#E6EAFC;
  --c-rata:#2C47D3; --c-sub:#7B4ED8; --c-altro:#0C8A80;
  --c-rata-soft:#E6EAFC; --c-sub-soft:#EFE8FB; --c-altro-soft:#DFF3F1;
  --s-paid:#167A3E; --s-paid-bg:#E1F4E7; --s-due:#B85A08; --s-due-bg:#FCEDD9; --s-over:#C42E2A; --s-over-bg:#FBE2E1; --s-fut:#646A80; --s-fut-bg:#ECEEF4;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 30px -18px rgba(20,24,40,.25);
  --overlay:rgba(14,16,28,.42);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F17; --surface:#161925; --surface-2:#1B1F2D; --ink:#ECEEF6; --ink-2:#B7BCCF; --muted:#878DA4; --line:#272B3C; --line-2:#202434;
  --accent:#8297FF; --accent-ink:#0D0F17; --accent-soft:#1E2649;
  --c-rata:#8297FF; --c-sub:#B597F7; --c-altro:#3DC6B9;
  --c-rata-soft:#1E2649; --c-sub-soft:#2A2145; --c-altro-soft:#123330;
  --s-paid:#5ED98A; --s-paid-bg:#12301F; --s-due:#F3A650; --s-due-bg:#3A2911; --s-over:#F77E7A; --s-over-bg:#3C1818; --s-fut:#9CA1B6; --s-fut-bg:#232737;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6); --overlay:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F17; --surface:#161925; --surface-2:#1B1F2D; --ink:#ECEEF6; --ink-2:#B7BCCF; --muted:#878DA4; --line:#272B3C; --line-2:#202434;
  --accent:#8297FF; --accent-ink:#0D0F17; --accent-soft:#1E2649;
  --c-rata:#8297FF; --c-sub:#B597F7; --c-altro:#3DC6B9;
  --c-rata-soft:#1E2649; --c-sub-soft:#2A2145; --c-altro-soft:#123330;
  --s-paid:#5ED98A; --s-paid-bg:#12301F; --s-due:#F3A650; --s-due-bg:#3A2911; --s-over:#F77E7A; --s-over-bg:#3C1818; --s-fut:#9CA1B6; --s-fut-bg:#232737;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6); --overlay:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.15;min-width:0}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--s-over-bg);color:var(--s-over);padding:1px 8px;border-radius:99px}
.side-add{margin:10px 0 6px}
.side-foot{margin-top:auto;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.cloud{background:var(--s-paid)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:22px;font-weight:600;flex:none}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 38px}
.search .ico{position:absolute;left:11px;top:10px;color:var(--muted)}
.search input[type=search]{padding-left:38px}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px;z-index:40}
.results .grp{padding:8px 10px 4px}
.res{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;text-align:left}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.res .grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--s-over);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.content{max-width:1200px;width:100%;margin:0 auto;padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.bnav{display:none}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--s-over);border-color:color-mix(in srgb,var(--s-over) 40%,var(--line))}
.btn.ok{background:var(--s-paid);border-color:var(--s-paid);color:var(--surface)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-paid{background:var(--s-paid-bg);color:var(--s-paid)}
.st-due{background:var(--s-due-bg);color:var(--s-due)}
.st-overdue,.st-late{background:var(--s-over-bg);color:var(--s-over)}
.st-future{background:var(--s-fut-bg);color:var(--s-fut)}
.kind{font-size:12px;font-weight:600;padding:2px 8px;border-radius:7px;white-space:nowrap}
.k-rata{background:var(--c-rata-soft);color:var(--c-rata)}
.k-sub{background:var(--c-sub-soft);color:var(--c-sub)}
.k-altro{background:var(--c-altro-soft);color:var(--c-altro)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-h h2{font-size:18px;font-weight:600}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .eyebrow,.kpi.hero .sub{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.hbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden;margin-top:8px}
.hbar i{display:block;height:100%;border-radius:99px;background:var(--accent-ink);min-width:0;transition:width .4s ease}
.hbar-l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:color-mix(in srgb,var(--accent-ink) 78%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar-l b{color:var(--accent-ink);font-weight:700}
.kpi-sub{background:var(--c-sub-soft);border-color:color-mix(in srgb,var(--c-sub) 30%,var(--line))}
.kpi-sub .val{color:var(--c-sub)}
.kpi .val small{font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:0;opacity:.75}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-btn{text-align:left;cursor:pointer}
.kpi-btn:hover{border-color:var(--muted)}

.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--s-due-bg);color:var(--s-due);font-weight:600;font-size:14px;flex-wrap:wrap}
.alert.red{background:var(--s-over-bg);color:var(--s-over)}
.alert .link{color:inherit;text-decoration:underline;margin-left:auto}

/* payment rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:11px 8px;border-top:1px solid var(--line-2);border-radius:10px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.rows .row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.dbox{display:flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;border-radius:12px;background:var(--surface-2);line-height:1}
.dbox b{font-family:var(--f-display);font-size:19px;font-weight:600}
.dbox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.dbox.st-overdue,.dbox.st-late{background:var(--s-over-bg)} .dbox.st-due{background:var(--s-due-bg)} .dbox.st-paid{background:var(--s-paid-bg)}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.paid-amt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}

.insight{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.insight:first-child{border-top:0;padding-top:0}
.insight .ib{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.insight .ib .ico{width:16px;height:16px}
.insight p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.insight strong{color:var(--ink)}

.horizon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hz{padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left}
.hz b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.hz span{font-size:12px;color:var(--muted)}

/* rate cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.icard.dim{opacity:.62}
.ic-head{display:flex;gap:12px;align-items:flex-start}
.ic-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;font-family:var(--f-display);font-weight:700}
.ic-title{flex:1;min-width:0}
.ic-title h3{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-title .muted{font-size:13px}
.ic-price{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ic-price small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c-rata)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:13px}
.kv div span{display:block;color:var(--muted);font-size:12px}
.kv div b{font-weight:600;font-variant-numeric:tabular-nums}
.ic-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-2);padding-top:12px;font-size:13px}
.ic-foot{flex-wrap:wrap}
.ic-foot .grow{flex:1 1 200px;min-width:0}
.sumbar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.sumbar div span{display:block;font-size:12.5px;color:var(--muted)}
.sumbar div b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sumbar .btn{margin-left:auto}

.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-bar h2{font-size:22px;font-weight:600;text-transform:capitalize;margin-right:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--line)}
.month .wd{background:var(--surface-2);padding:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 1px 1px 0}
.cell{background:var(--surface);min-height:112px;padding:7px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;margin:0 1px 1px 0;min-width:0;cursor:pointer}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2)}
.cell.out .dn{color:var(--muted);opacity:.6}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:8px}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.chip{display:flex;gap:5px;align-items:center;font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;min-width:0;border:0;text-align:left;width:100%}
.chip .cn{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.chip .ca{font-variant-numeric:tabular-nums;opacity:.85}
.chip.paid{opacity:.55;text-decoration:line-through}
.chip.overdue,.chip.late{box-shadow:inset 0 0 0 1.5px var(--s-over)}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
.daytot{display:none;font-size:10.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol.today{border-color:var(--accent)}
.wcol h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.wcol h4 b{color:var(--ink);font-family:var(--f-display);font-size:18px;letter-spacing:0}
.wtot{margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* payments */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .toggle-box{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 7px 0 11px;background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);min-width:0;cursor:pointer}
.toggle-box>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.month-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 8px 6px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:capitalize;border-bottom:1px solid var(--line)}
.month-h span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

/* ================= date (stringhe ISO YYYY-MM-DD, senza fusi) ================= */
const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parse=s=>{const a=s.split("-").map(Number);return{y:a[0],m:a[1],d:a[2]}};
const dim=(y,m)=>new Date(y,m,0).getDate();
const now=new Date();
const TODAY=iso(now.getFullYear(),now.getMonth()+1,now.getDate());
function addMonths(s,n,dom){const p=parse(s);const t=p.y*12+(p.m-1)+n;const y=Math.floor(t/12),m=t-y*12+1;return iso(y,m,Math.min(dom||p.d,dim(y,m)))}
function addDays(s,n){const p=parse(s);const d=new Date(Date.UTC(p.y,p.m-1,p.d+n));return d.toISOString().slice(0,10)}
function diffDays(a,b){const x=parse(a),y=parse(b);return Math.round((Date.UTC(y.y,y.m-1,y.d)-Date.UTC(x.y,x.m-1,x.d))/864e5)}
const monthKey=s=>s.slice(0,7);
const dow=s=>{const p=parse(s);return new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()};
function fmtDate(s,opt){const p=parse(s);const t=parse(TODAY);let r=`${p.d} ${MONTHS[p.m-1]}`;if((opt&&opt.year)||p.y!==t.y)r+=` ${p.y}`;return r}
const fmtShort=s=>{const p=parse(s);return `${p.d} ${MSHORT[p.m-1]}`};
function rel(s){const d=diffDays(TODAY,s);if(d===0)return"oggi";if(d===1)return"domani";if(d===-1)return"ieri";if(d>0)return`tra ${d} giorni`;return`${-d} giorni fa`}

/* ================= motore delle scadenze ================= */
const isRata=it=>it.kind==="rata";
// sospensioni: elenco di periodi {from,to}; "to" vuoto = finché non la riattivi
const pauseNow=it=>(it.pauses||[]).find(p=>p.from<=TODAY&&(!p.to||TODAY<p.to))||null;
const inPause=(it,d)=>(it.pauses||[]).some(p=>p.from<=d&&(!p.to||d<p.to));
const subStatus=it=>it.status==="cancellato"?"cancellato":pauseNow(it)?"pausa":"attivo";
function inactive(it){return isRata(it)?it.status==="sospesa":subStatus(it)!=="attivo"}
function stepDate(it,i){
  const base=isRata(it)?it.start:it.anchor;const f=FREQ[it.freq]||FREQ.monthly;
  if(f.m){const dom=isRata(it)?(+it.dom||parse(base).d):parse(base).d;return addMonths(base,i*f.m,dom)}
  if(f.w)return addDays(base,i*7);
  return addDays(base,i*Math.max(1,+it.customDays||30));
}
function monthlyEq(it){const f=FREQ[it.freq]||FREQ.monthly;const a=+it.amount||0;if(f.m)return a/f.m;if(f.w)return a*52/12;return a*365/12/Math.max(1,+it.customDays||30)}

function compute(){
  if(C)return C;
  const occ=[],byKey={},byItem={},seen=new Set();const until=addDays(TODAY,400);
  for(const it of S.items){
    const list=[];
    if(isRata(it)){const n=Math.max(0,Math.min(600,+it.total||0));for(let i=0;i<n;i++)list.push([i,stepDate(it,i)])}
    else{
      if(!it.anchor)continue;
      const since=it.since&&it.since<it.anchor?it.since:null;
      if(since){const back=[];for(let i=-1;i>-400;i--){const d=stepDate(it,i);if(d<since)break;back.push([i,d])}list.push(...back.reverse())}
      for(let i=0;i<1000;i++){const d=stepDate(it,i);if(d>until||(it.end&&d>it.end))break;list.push([i,d])}
    }
    byItem[it.id]=[];
    for(const [i,d] of list){
      const key=it.id+"@"+d;if(seen.has(key))continue;
      let amount=+it.amount||0;if(isRata(it)&&i===(+it.total-1)&&it.finalAmount!=null&&it.finalAmount!=="")amount=+it.finalAmount;
      let implicit=isRata(it)?(i<(+it.paidInit||0)||(!!it.autopay&&d<=TODAY)):d<it.anchor;
      if(isRata(it)&&it.status==="completata")implicit=true;
      const rec=S.payments[key];
      let paid=rec?rec.status==="paid":implicit;
      if(!paid&&(isRata(it)?(inactive(it)&&d>=TODAY):(inPause(it,d)||(it.status==="cancellato"&&d>=(it.cancelledOn||TODAY)))))continue;
      seen.add(key);
      const o={key,item:it,itemId:it.id,idx:i,date:d,amount:(paid&&rec&&rec.amount!=null)?rec.amount:amount,name:it.name,kind:it.kind,category:it.category,method:it.method,notes:it.notes,emoji:it.emoji,implicit,rec,currency:it.currency||cur()};
      o.status=stat(o,paid,rec);occ.push(o);byKey[key]=o;byItem[it.id].push(o);
    }
  }
  // pagamenti registrati che non corrispondono più a una scadenza (es. dopo una modifica): restano nello storico
  for(const key in S.payments){const r=S.payments[key];if(seen.has(key)||r.status!=="paid")continue;
    const it=S.items.find(x=>x.id===r.itemId)||null;
    const o={key,item:it,itemId:r.itemId,idx:-1,date:r.date,amount:r.amount,name:r.name,kind:r.kind,category:r.category,method:r.method,notes:"",emoji:r.emoji||"",implicit:false,rec:r,orphan:true,currency:cur(),status:"paid"};
    occ.push(o);byKey[key]=o;if(byItem[r.itemId])byItem[r.itemId].push(o)}
  occ.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.name>b.name?1:-1));
  C={occ,byKey,byItem};return C;
}
function stat(o,paid,rec){if(paid)return"paid";if(rec&&rec.status==="late")return"late";if(o.date<TODAY)return"overdue";if(diffDays(TODAY,o.date)<=7)return"due";return"future"}
const unpaid=o=>o.status!=="paid";
function sum(arr){return arr.reduce((s,o)=>s+(+o.amount||0),0)}
function between(from,to){return compute().occ.filter(o=>o.date>=from&&o.date<=to)}
function upcoming(days){const to=addDays(TODAY,days);return compute().occ.filter(o=>unpaid(o)&&o.date>=TODAY&&o.date<=to)}
function overdueList(){return compute().occ.filter(o=>o.status==="overdue"||o.status==="late")}
function rataStats(it){
  const list=(compute().byItem[it.id]||[]).filter(o=>!o.orphan);
  const paid=list.filter(o=>o.status==="paid");const rest=list.filter(unpaid);
  const total=sum(list);const paidAmt=sum(paid);
  const next=rest[0]||null;const last=list.length?list[list.length-1].date:null;
  return{count:list.length,paidN:paid.length,restN:rest.length,paidAmt,restAmt:total-paidAmt,total,next,last,pct:list.length?paid.length/list.length:0};
}
function subStats(it){
  const list=(compute().byItem[it.id]||[]);const y=TODAY.slice(0,4);
  const next=list.find(o=>unpaid(o))||null;
  const spentYear=sum(list.filter(o=>o.status==="paid"&&o.date.slice(0,4)===y));
  const m=monthlyEq(it);return{monthly:m,yearly:m*12,next,spentYear};
}

const activeSubs=k=>S.items.filter(it=>it.kind===(k||"sub")&&subStatus(it)==="attivo");

function insights(){
  const out=[];const mk=monthKey(TODAY);const prev=monthKey(addMonths(mk+"-01",-1));
  const mt=sum(compute().occ.filter(o=>monthKey(o.date)===mk)),pt=sum(compute().occ.filter(o=>monthKey(o.date)===prev));
  const d=mt-pt;
  if(Math.abs(d)>=1)out.push({i:"trend",t:`Questo mese hai <strong>${money(Math.abs(d))}</strong> ${d>0?"in più":"in meno"} di impegni rispetto al mese scorso.`});
  const subs=activeSubs("sub");const sm=subs.reduce((s,it)=>s+monthlyEq(it),0);
  if(subs.length)out.push({i:"sub",t:`Hai <strong>${subs.length} subscription attive</strong> per un costo di ${money(sm)} al mese.`});
  const ending=activeRate().map(it=>({it,st:rataStats(it)})).filter(x=>x.st.last&&x.st.last>=TODAY).sort((a,b)=>a.st.last<b.st.last?-1:1)[0];
  if(ending){const dd=diffDays(TODAY,ending.st.last);out.push({i:"flag",t:dd<=120?`Tra <strong>${dd} giorni</strong> terminerà la rata “${esc(ending.it.name)}”.`:`La prima rata a terminare è “${esc(ending.it.name)}”, a ${fmtDate(ending.st.last,{year:true})} (mancano ${ending.st.restN} rate).`})}
  out.push({i:"clock",t:`Nei prossimi 30 giorni dovrai pagare <strong>${money(sum(upcoming(30)))}</strong>.`});
  const all=S.items.filter(it=>!inactive(it)&&!(isRata(it)&&(it.status==="completata"||rataStats(it).restN===0)));
  const tot=all.reduce((s,it)=>s+monthlyEq(it),0);
  if(tot>0&&sm>0)out.push({i:"pie",t:`Le tue subscription rappresentano il <strong>${Math.round(sm/tot*100)}%</strong> dei tuoi impegni mensili.`});
  return out;
}

/* ================= PAGAMENTI ================= */
function filteredPayments(){
  const f=UI.pf;const q=f.q.trim().toLowerCase();
  return compute().occ.filter(o=>{
    if(f.tab==="futuri"&&!(unpaid(o)&&o.date>=TODAY))return false;
    if(f.tab==="effettuati"&&o.status!=="paid")return false;
    if(f.tab==="scaduti"&&!(o.status==="overdue"||o.status==="late"))return false;
    if(f.tab!=="scaduti"){if(f.from&&o.date<f.from)return false;if(f.to&&o.date>f.to)return false}
    if(f.kind&&o.kind!==f.kind)return false;if(f.cat&&o.category!==f.cat)return false;if(f.method&&o.method!==f.method)return false;
    if(f.status&&o.status!==f.status)return false;
    if(f.min!==""&&o.amount<+f.min)return false;if(f.max!==""&&o.amount>+f.max)return false;
    if(q&&!(o.name+" "+(o.category||"")+" "+(o.method||"")).toLowerCase().includes(q))return false;
    return true;});
}

function incomeChart(rows){
  const W=900,H=240,L=56,R=12,T=24,B=30;const max=niceMax(Math.max(...rows.map(r=>Math.max(r.i||0,r.o))));
  const cw=(W-L-R)/12,bw=Math.min(18,cw*.3);const y=v=>T+(H-T-B)*(1-v/max);
  let g="";for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${moneyR(v)}</text>`}
  let bars="";rows.forEach((r,i)=>{const cx=L+i*cw+cw/2;
    if(r.i!=null)bars+=`<rect x="${cx-bw-1}" y="${y(r.i)}" width="${bw}" height="${Math.max(0,y(0)-y(r.i))}" rx="3" fill="var(--s-paid)"><title>${MONTHS[r.m-1]}: stipendio ${money(r.i)}</title></rect>`;
    bars+=`<rect x="${cx+1}" y="${y(r.o)}" width="${bw}" height="${Math.max(0,y(0)-y(r.o))}" rx="3" fill="var(--s-over)" opacity="${r.i!=null?1:.35}"><title>${MONTHS[r.m-1]}: uscite ${money(r.o)}</title></rect>`;
    if(r.pct!=null)bars+=`<text x="${cx}" y="${Math.min(y(r.i),y(r.o))-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-2)">${Math.round(r.pct)}%</text>`;
    bars+=`<text x="${cx}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${MSHORT[r.m-1]}</text>`;
    bars+=`<rect class="hit" x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T}" fill="transparent" data-act="incMonth" data-k="${r.k}"><title>Apri ${MONTHS[r.m-1]}</title></rect>`});
  return `<div class="legend" style="margin-bottom:6px"><span><i style="background:var(--s-paid)"></i>Stipendio</span><span><i style="background:var(--s-over)"></i>Uscite</span><span>% = uscite sullo stipendio · tocca un mese per il dettaglio</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Stipendio e uscite per mese">${g}${bars}</svg>`;
}
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
function barChart(data){
  const W=900,H=300,L=56,R=12,T=16,B=40;const max=niceMax(Math.max(...data.map(d=>d.rata+d.sub+d.altro)));
  const cw=(W-L-R)/data.length,bw=Math.min(30,cw*.58);const y=v=>T+(H-T-B)*(1-v/max);const cm=monthKey(TODAY);
  let g="";for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${moneyR(v)}</text>`}
  let bars="";data.forEach((d,i)=>{const x=L+i*cw+(cw-bw)/2;let base=0;const fut=d.k>cm;
    for(const k of["rata","sub","altro"]){const v=d[k];if(v<=0)continue;const y1=y(base+v),h=y(base)-y1;bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,h-1)}" rx="3" fill="var(--c-${k})" opacity="${fut?.5:1}"><title>${monthLabel(d.k)} · ${KIND[k].pl}: ${money(v)}</title></rect>`;base+=v}
    const tot=d.rata+d.sub+d.altro;const mm=+d.k.slice(5);
    bars+=`<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="${d.k===cm?"var(--ink)":"var(--muted)"}" font-weight="${d.k===cm?700:400}">${MSHORT[mm-1]}</text>`;
    if(mm===1||i===0)bars+=`<text x="${x+bw/2}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.k.slice(0,4)}</text>`;
    if(d.k===cm&&tot>0)bars+=`<text x="${x+bw/2}" y="${y(tot)-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${moneyR(tot)}</text>`;});
  const ci=data.findIndex(d=>d.k===cm);const sx=L+ci*cw+cw;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico impegni mensili">${g}<line x1="${sx}" x2="${sx}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>${bars}</svg>`;
}
function donut(parts){
  const tot=parts.reduce((s,p)=>s+p[1],0);const r=62,c=2*Math.PI*r;let off=0;
  const segs=tot>0?parts.filter(p=>p[1]>0).map(p=>{const len=p[1]/tot*c;const s=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--c-${p[2]})" stroke-width="22" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`;off+=len;return s}).join(""):"";
  return `<div class="donut-wrap"><svg viewBox="0 0 170 170" role="img" aria-label="Distribuzione impegni"><circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="22"/>${segs}
    <text x="85" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, Figtree, sans-serif">${moneyR(tot)}</text><text x="85" y="101" text-anchor="middle" font-size="11" fill="var(--muted)">al mese</text></svg>
    <div class="dleg">${parts.map(p=>`<div><i style="background:var(--c-${p[2]})"></i>${p[0]}<b>${tot?Math.round(p[1]/tot*100):0}%</b></div>`).join("")}</div></div>`;
}

function nextFromSince(it){const tmp={kind:"sub",anchor:it.since,freq:it.freq,customDays:it.customDays};

function rataTotal(d){const a=+d.amount||0,n=+d.total||0;if(!n)return 0;const last=d.finalAmount!=null&&d.finalAmount!==""?+d.finalAmount:a;return a*(n-1)+last}

function ratePreview(){
  const box=document.getElementById("ratePrev");const f=document.getElementById("itemForm");if(!box||!f)return;
  const T=numIn(f.amount.value),n=parseInt(f.total.value),start=f.start.value;
  if(!(T>0)||!(n>=1)||n>600||!start){box.innerHTML=`<div class="rprev"><p class="rprev-empty">Inserisci importo totale, numero di rate e data della prima rata per vedere l'importo di ogni rata e le scadenze.</p></div>`;return}
  const sp=splitTotal(T,n);const tmp={kind:"rata",start,dom:parse(start).d,freq:f.freq.value,customDays:+(f.customDays&&f.customDays.value)||30,total:n};
  const idField=f.querySelector("[name=itemId]").value;const prev=idField?S.items.find(x=>x.id===idField):null;
  const ref=prev?(prev.createdOn||null):TODAY;
  const paidN=ref?countBefore(tmp,ref):Math.min(+prev.paidInit||0,n);
  const auto=!!(f.autopay&&f.autopay.checked);
  let paidCount=0,nextI=-1;const rows=[];
  for(let i=0;i<n;i++){
    const d=stepDate(tmp,i);const key=prev?prev.id+"@"+d:null;const rec=key?S.payments[key]:null;
    const paid=rec?rec.status==="paid":(i<paidN||(auto&&d<=TODAY));

  }

    <div class="rprev-top"><div><span>Importo di ogni rata</span><b>${money(sp.amount)}</b>${sp.final!=null?`<em>ultima rata ${money(sp.final)}</em>`:""}</div>

const numIn=v=>{if(v==null)return NaN;v=String(v).trim().replace(/\s/g,"");if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,"");return parseFloat(v)};
function saveForm(form){
  const fd=new FormData(form);const g=k=>(fd.get(k)||"").toString().trim();const err=m=>{const e=document.getElementById("formErr");e.textContent=m;e.hidden=false};
  const kind=g("kind");const id=g("itemId");const prev=id?S.items.find(x=>x.id===id):null;
  const amount=numIn(g("amount"));if(!g("name"))return err("Inserisci un nome.");if(!(amount>0))return err("Inserisci un importo valido, ad esempio 17,99.");
  const it={id:prev?prev.id:uid(),kind,name:g("name"),desc:g("desc"),amount:Math.round(amount*100)/100,freq:g("freq")||"monthly",customDays:Math.max(1,parseInt(g("customDays"))||30),category:g("category"),method:g("method"),notes:g("notes"),status:g("status"),reminder:+g("reminder")||0,demo:false};
  if(kind==="rata"){
    it.total=parseInt(g("total"));it.start=g("start");it.emoji="";it.autopay=!!fd.get("autopay");
    if(!(it.total>=1&&it.total<=600))return err("Il numero di rate deve essere tra 1 e 600.");
    if(!it.start)return err("Indica la data della prima rata.");
    if(Math.round(amount*100)<it.total)return err("L'importo totale è troppo basso per questo numero di rate.");
    it.dom=parse(it.start).d;
    const sp=splitTotal(amount,it.total);it.amount=sp.amount;it.finalAmount=sp.final;
    // le rate con data precedente al giorno di inserimento risultano già pagate
    it.createdOn=prev?(prev.createdOn||null):TODAY;
    it.paidInit=it.createdOn?countBefore(it,it.createdOn):Math.min(+prev.paidInit||0,it.total);
  }else{
    it.emoji=g("emoji");it.currency=g("currency")||cur();it.since=g("since");it.end=g("end");
    if(!it.since)return err("Indica la data di inizio.");
    // il prossimo pagamento è il primo rinnovo da oggi in poi, partendo dalla data di inizio
    const same=prev&&prev.anchor&&prev.since===it.since&&prev.freq===it.freq&&(+prev.customDays||30)===it.customDays;
    it.anchor=same?prev.anchor:nextFromSince(it);
    if(it.end&&it.end<it.anchor)return err("La data di scadenza è precedente al prossimo pagamento.");
    if(it.since&&it.since>it.anchor)return err("La data di inizio non può essere dopo il prossimo pagamento.");
    it.pauses=prev&&prev.pauses?prev.pauses.map(p=>Object.assign({},p)):[];it.cancelledOn=prev?prev.cancelledOn:undefined;
    const want=it.status;it.status=want==="cancellato"?"cancellato":"attivo";
    if(want==="cancellato"&&!(prev&&prev.status==="cancellato"))it.cancelledOn=TODAY;
    if(want==="pausa"&&!pauseNow(it))it.pauses.push({from:TODAY,to:""});
    if(want==="attivo")endPause(it);
  }
  if(prev){const i=S.items.indexOf(prev);S.items[i]=it;
    // le scadenze future si rigenerano; lo storico dei pagamenti registrati resta invariato
    for(const k in S.payments){const r=S.payments[k];if(r.itemId===it.id&&r.status!=="paid"&&r.date>=TODAY)delete S.payments[k]}
  }else S.items.push(it);
  closeModal();commit(prev?"Modifiche salvate":`${it.name} aggiunto`);
}

function csvCell(v){v=v==null?"":String(v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const toCSV=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\n");
function parseCSV(txt){txt=txt.replace(/^﻿/,"");const first=txt.split("\n")[0]||"";const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],cell="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=""}else if(ch==="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell=""}else cell+=ch}
  if(cell||row.length){row.push(cell.replace(/\r$/,""));rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
const ITEM_COLS=["tipo","nome","descrizione","importo","valuta","frequenza","ogni_giorni","data","inizio","fine","rate_totali","rate_pagate","giorno_scadenza","importo_finale","categoria","metodo","stato","promemoria","emoji","note"];

function doImport(type){
  const txt=document.getElementById("impText").value.trim();const e=document.getElementById("impErr");const fail=m=>{e.textContent=m;e.hidden=false};
  if(!txt)return fail("Scegli un file o incolla il contenuto.");

  const rows=parseCSV(txt);if(rows.length<2)return fail("Il CSV non contiene righe di dati.");
  const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);if(ix("nome")<0||ix("importo")<0)return fail("Mancano le colonne “nome” e “importo”.");
  let added=0,skipped=0;const v=(r,k)=>ix(k)>=0?(r[ix(k)]||"").trim():"";const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
  for(const r of rows.slice(1)){
    const t=v(r,"tipo").toLowerCase();const kind=t.startsWith("rat")?"rata":t.startsWith("ric")||t.startsWith("alt")||t.startsWith("spes")?"altro":"sub";
    const amount=numIn(v(r,"importo"));const date=v(r,"data")||TODAY;if(!v(r,"nome")||!(amount>0)||!okDate(date)){skipped++;continue}
    const freq=FREQ[v(r,"frequenza")]?v(r,"frequenza"):"monthly";
    const base={id:uid(),kind,name:v(r,"nome"),desc:v(r,"descrizione"),amount,freq,customDays:parseInt(v(r,"ogni_giorni"))||30,category:v(r,"categoria")||"Altro",method:v(r,"metodo")||S.methods[0],notes:v(r,"note"),reminder:parseInt(v(r,"promemoria"))||0,emoji:v(r,"emoji")};
    if(base.category&&!allCats().includes(base.category))S.customCats.push(base.category);
    if(base.method&&!S.methods.includes(base.method))S.methods.push(base.method);
    if(kind==="rata"){const fa=v(r,"importo_finale");Object.assign(base,{total:parseInt(v(r,"rate_totali"))||12,paidInit:parseInt(v(r,"rate_pagate"))||0,start:date,dom:parseInt(v(r,"giorno_scadenza"))||parse(date).d,finalAmount:fa?numIn(fa):null,status:ITEM_STATUS.rata[v(r,"stato")]?v(r,"stato"):"attiva"})}

    S.items.push(base);added++}
  if(!added)return fail("Nessuna riga valida trovata. Controlla nome, importo e data (AAAA-MM-GG).");

}

    case"logout":doLogout();break;
    case"delDemo":confirmBox("Eliminare i dati demo?","Gli elementi di esempio e i relativi pagamenti verranno rimossi. Quelli che hai aggiunto o modificato restano.","doDelDemo","Elimina dati demo");break;
    case"doDelDemo":{const ids=new Set(S.items.filter(i=>i.demo).map(i=>i.id));S.items=S.items.filter(i=>!i.demo);for(const k in S.payments)if(ids.has(S.payments[k].itemId))delete S.payments[k];S.demo=false;closeModal();commit("Dati demo eliminati");break}
    case"loadDemo":{const d=demoState();S.items=S.items.concat(d.items);commit("Dati demo caricati");break}
    case"resetAll":confirmBox("Cancellare tutto?","Tutte le rate, le subscription e lo storico dei pagamenti verranno eliminati. Esporta un backup prima, se ti serve.","doReset","Cancella tutto");break;
    case"doReset":{const s=S.settings,m=S.methods,c=S.customCats;S=blankState();S.settings=s;S.methods=m;S.customCats=c;closeModal();commit("Dati cancellati");break}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(document.querySelector(".scrim"))closeModal();else if(UI.search){UI.search="";renderTop()}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".cell")){e.preventDefault();e.target.click()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="gsearch"){UI.search=t.value;renderResults();return}
  if(t.dataset.prev||t.id==="f_cd"){ratePreview();return}
  if(t.dataset.pf&&(t.type==="search"||t.type==="number")){UI.pf[t.dataset.pf]=t.value;const pos=t.selectionStart;const id=t.id;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.income){const v=t.value.trim();const n=numIn(v);const err=v&&!(n>=0);
    if(err){toast("Importo non valido: scrivi ad esempio 1850 o 1.850,50");return}
    if(!v)delete S.income[t.dataset.income];else S.income[t.dataset.income]=Math.round(n*100)/100;
    setTimeout(()=>commit(),0);return}
  if(t.dataset.change==="status"){setStatus(t.dataset.key,t.value);return}
  if(t.dataset.change==="freq"){document.getElementById("customWrap").hidden=t.value!=="custom";ratePreview();return}
  if(t.dataset.pf&&t.type!=="search"&&t.type!=="number"){UI.pf[t.dataset.pf]=t.value;render();return}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==="checkbox"?t.checked:(["weekStart","remindDefault"].includes(k)?+t.value:t.value);if(k==="theme")applyTheme();commit("Impostazioni salvate")}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.getAttribute("id")==="itemForm"){saveForm(f);return}
  if(f.dataset.form==="incOne"){const n=numIn(document.getElementById("incOneVal").value);if(!(n>=0)){toast("Inserisci un importo, ad esempio 1850");return}
    S.income[f.dataset.k]=Math.round(n*100)/100;commit("Stipendio salvato");openIncMonth(f.dataset.k);return}
  if(f.dataset.form==="incFill"){const n=numIn(document.getElementById("incFillVal").value);if(!(n>0)){toast("Inserisci un importo, ad esempio 1850");return}
    let k=0;for(let m=1;m<=12;m++){const key=`${UI.incYear}-${pad(m)}`;if(S.income[key]==null){S.income[key]=Math.round(n*100)/100;k++}}
    commit(k?`Stipendio inserito in ${k} mesi`:"Tutti i mesi hanno già uno stipendio");return}
  if(f.dataset.form==="cat"){const v=document.getElementById("newCat").value.trim();if(!v)return;if(allCats().some(c=>c.toLowerCase()===v.toLowerCase())){toast("Categoria già presente");return}S.customCats.push(v);commit("Categoria aggiunta")}
  if(f.dataset.form==="method"){const v=document.getElementById("newMethod").value.trim();if(!v)return;if(/\d{6,}/.test(v.replace(/[\s-]/g,""))){toast("Non inserire numeri di carta o conto: usa solo un nome");return}if(S.methods.includes(v)){toast("Metodo già presente");return}S.methods.push(v);commit("Metodo aggiunto")}
});
document.addEventListener("click",e=>{if(UI.search&&!e.target.closest("#searchBox")){UI.search="";const i=document.getElementById("gsearch");if(i)i.value="";renderResults()}},true);

/* ================= avvio ================= */
S=normalize(lsGet()||blankState());
applyTheme();
startAuth();
})();
</script>

</body>
</html>
