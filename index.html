<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Track your payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EDF0F4;--surface:#FFFFFF;--sunk:#F3F5F8;--line:#E5E9EE;--ink:#0E1630;--ink2:#465065;--muted:#7B8597;
  --pos:#0B8A60;--neg:#D23F36;--amber:#B57406;--violet:#6447D1;--blue:#2B59E8;
  --pos-soft:#E2F3EB;--neg-soft:#FBE9E7;--amber-soft:#FBF0DA;--violet-soft:#EEEAFB;
  --r-xl:28px;--r-lg:20px;--r-md:12px;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px}
.green{color:var(--pos)} .red{color:var(--neg)} .orange{color:var(--amber)}
.bg-green{background:var(--pos)} .bg-red{background:var(--neg)} .bg-orange{background:var(--amber)} .bg-muted{background:#C3C9D3} .bg-purple{background:var(--violet)}
h3{font-weight:600;letter-spacing:-.01em}

/* accesso */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-xl);padding:32px 28px}
.box h1{margin:18px 0 6px;font-size:26px;letter-spacing:-.025em;font-weight:650}
.box p{margin:0 0 22px}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;flex:none}
.box .logo{width:48px;height:48px;border-radius:14px;font-size:24px}
label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 14px}
input,select{display:block;width:100%;margin-top:6px;padding:12px 14px;background:var(--sunk);border:1.5px solid transparent;border-radius:var(--r-md);outline:none;transition:border-color .15s,background .15s}
input:focus,select:focus{border-color:var(--ink);background:#fff}
input::placeholder{color:#A2AAB8}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--sunk);color:var(--ink)}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--ink);color:#fff}
.btn.green{background:var(--pos);color:#fff}
.btn.red{background:var(--neg-soft);color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.btn.full{width:100%;margin-top:8px;padding:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
#auth-msg{margin-top:14px;font-size:13px}

/* intestazione e sezioni */
.top{position:sticky;top:0;z-index:5;background:rgba(237,240,244,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:12px 20px 0}
.top-row{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.month{margin:0 auto;display:flex;align-items:center;background:var(--surface);border-radius:999px;padding:4px}
.month button{background:none;border:0;width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:19px;color:var(--ink2)}
.month button:hover{background:var(--sunk)}
.month span{min-width:140px;text-align:center;font-weight:600;cursor:pointer}
.ghost{background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink2);font-weight:500}
.ghost:hover{background:var(--surface)}
.tabs{display:flex;gap:4px;max-width:1080px;margin:12px auto 0;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:999px;padding:9px 16px;color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:550}
.tabs button:hover{background:rgba(255,255,255,.7)}
.tabs button.active{background:var(--ink);color:#fff}
.ti{display:flex} .ti svg{width:18px;height:18px}
main{max-width:1120px;margin:0 auto;padding:8px 20px 64px}

.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;min-width:0}
.card h3{margin:0 0 14px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .card{margin:0}
.span2{grid-column:1/-1}
.chart{position:relative;height:260px}
.empty{color:var(--muted);text-align:center;padding:28px 8px;margin:0}

/* carta del saldo */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:var(--r-xl);padding:24px 24px 22px;margin-bottom:12px;
  background:radial-gradient(90% 130% at 100% 0%,rgba(91,124,250,.5),transparent 60%),linear-gradient(155deg,#1A275E 0%,#0E1630 62%)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:rgba(255,255,255,.72);font-size:14px}
.hero-pill{padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.13);color:#fff;font-size:12.5px;font-weight:550}
.hero-amt{font-size:clamp(38px,8vw,54px);font-weight:650;letter-spacing:-.04em;line-height:1.05;margin:14px 0 20px}
.hero-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:99px;background:#7FE3B8}
.hero-bar i.warn{background:#FFC857} .hero-bar i.bad{background:#FF8A80}
.hero-cap{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:7px}
.hero-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.hero-figs span{display:block;font-size:12.5px;color:rgba(255,255,255,.62)}
.hero-figs b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.due-strip{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px;cursor:pointer;width:100%;border:0;text-align:left}
.due-ic{width:42px;height:42px;border-radius:13px;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none}
.due-ic svg{width:20px;height:20px}
.due-strip .grow{flex:1;min-width:0} .due-strip b{display:block;font-size:17px;font-weight:600} .due-strip small{color:var(--muted);font-size:13.5px}
.chev{color:var(--muted);font-size:24px;line-height:1}
.notice{background:var(--neg-soft);color:var(--neg);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px;font-weight:500;font-size:14px}

.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar.big{margin:16px 0 14px}
.bar i{display:block;height:100%;border-radius:99px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .btn.green{background:var(--pos-soft);color:var(--pos)}
.toolbar .btn.red{background:var(--neg-soft);color:var(--neg)}
.toolbar select{width:auto;margin:0 0 0 auto;background:var(--surface)}
.summary{display:flex;gap:30px;flex-wrap:wrap}
.summary div{display:flex;flex-direction:column;gap:2px}
.summary b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}
.row .grow{flex:1;min-width:0}
.row .grow b{font-weight:550}
.row .grow b,.row .grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow small{color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:650;flex:none;font-size:15px}
.av.entrata{background:var(--pos-soft);color:var(--pos)} .av.uscita{background:var(--neg-soft);color:var(--neg)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;background:var(--sunk);color:var(--ink2);margin-left:4px}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:8px}
.icon:hover{background:var(--sunk);color:var(--ink)}
.tag{font-size:12px;font-weight:550;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--pos-soft);color:var(--pos)} .tag.off{background:var(--neg-soft);color:var(--neg)}
.amt{white-space:nowrap;font-weight:600}

.rata-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rata-head h3{margin:0 0 2px;font-size:17px}
.rata-stats{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:13.5px;color:var(--muted)}
.rata-stats b{color:var(--ink);font-weight:600}
.rata.done{opacity:.6}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px;font-weight:550}
.cell{min-height:92px;background:var(--sunk);border-radius:12px;padding:7px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.empty{background:transparent}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.dn{font-size:12.5px;color:var(--ink2);font-weight:550}
.cell.today .dn{color:var(--ink);font-weight:700}
.cell .chips{display:flex;flex-direction:column;gap:3px}
.chip{border:0;text-align:left;font-size:11.5px;padding:3px 7px;border-radius:7px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip.rata{background:var(--amber-soft);color:var(--amber)} .chip.abb{background:var(--violet-soft);color:var(--violet)}
.chip.overdue{background:var(--neg-soft);color:var(--neg)}
.chip.paid{background:#E9ECF0;color:#98A1B0;text-decoration:line-through}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}

/* finestre */
.modal{position:fixed;inset:0;background:rgba(14,22,48,.4);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:var(--r-xl);padding:24px}
.modal:not(.hidden) .sheet{animation:sheet-in .22s ease-out}
@keyframes sheet-in{from{transform:translateY(14px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sheet-head h3{margin:0;font-size:19px}
.row-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.row-btns .left{margin-right:auto}
.occ-info{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sunk);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.occ-info div{display:flex;flex-direction:column}
.occ-info > b{font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mpick{display:flex;align-items:center;gap:6px}
.mpick button{background:var(--surface);border:0;border-radius:999px;width:42px;height:42px;cursor:pointer;flex:none;font-size:19px;color:var(--ink2)}
.mpick input{margin:0;width:auto;min-width:180px;text-align:center;font-weight:600;background:var(--surface)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:30;max-width:90vw;font-weight:500;font-size:14px}
#toast.err{background:var(--neg)}

@media(max-width:820px){ .grid2{grid-template-columns:1fr} }

/* ======== SMARTPHONE ======== */
@media(max-width:600px){
  input,select{font-size:16px}
  .top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .bfull{display:none}
  .top-row{gap:8px}
  .month{flex:1;justify-content:space-between;margin:0}
  .month span{min-width:0;font-size:15px}
  .ghost{padding:8px 10px}

  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);gap:0;
        background:rgba(255,255,255,.97);border-top:1px solid var(--line);
        padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-width:none;overflow:visible}
  .tabs button{flex-direction:column;gap:3px;padding:4px 0;border-radius:0;font-size:10.5px;font-weight:550;color:var(--muted)}
  .tabs button:hover{background:none}
  .tabs button.active{background:none;color:var(--ink)}
  .ti{padding:5px 16px;border-radius:999px}
  .ti svg{width:21px;height:21px}
  .tabs button.active .ti{background:var(--ink);color:#fff}
  .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  main{padding:4px 14px calc(100px + env(safe-area-inset-bottom))}

  .card{padding:16px;border-radius:18px}
  .hero{padding:20px 20px 18px;border-radius:24px}
  .hero-figs{gap:8px}
  .hero-figs b{font-size:15px}
  .grid2{gap:12px}
  .chart{height:230px}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .summary b{font-size:17px}

  .toolbar .btn{flex:1;padding:13px}
  .toolbar select{width:100%;margin:0}
  .mpick{width:100%}
  .mpick input{flex:1;min-width:0}

  .row{padding:11px 0}
  .row .icon{display:none}
  .row .tag{display:none}

  .icon{padding:8px 10px;font-size:16px}

  .cal{gap:4px}
  .cal .wd{font-size:11px}
  .cell{min-height:50px;padding:4px;border-radius:9px}
  .cell .chips{flex-direction:row;flex-wrap:wrap;gap:4px}
  .chip{font-size:0;padding:0;width:11px;height:11px;border-radius:50%;display:inline-block}
  .chip.rata{background:var(--amber)} .chip.abb{background:var(--violet)} .chip.overdue{background:var(--neg)} .chip.paid{background:#C3C9D3}

  .modal{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:24px 24px 0 0;max-height:88vh;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
  .modal:not(.hidden) .sheet{animation-name:sheet-up}
  .row-btns .btn{flex:1;padding:14px}
  .row-btns .left{margin-right:0}
  .two{grid-template-columns:1fr}

  #toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@keyframes sheet-up{from{transform:translateY(40px)}}
@media(prefers-reduced-motion:reduce){ .modal:not(.hidden) .sheet{animation:none} }
</style>
</head>
<body>

<!-- ============ SETUP (solo se non hai messo le chiavi nel codice) ============ -->
<div id="setup" class="center hidden">
  <form class="box" id="setup-form">
    <h1>Collega Supabase</h1>
    <p class="muted small">Trovi questi dati in Supabase → Project Settings → API. Vengono salvati solo in questo browser.</p>
    <label>Project URL<input name="url" placeholder="https://xxxx.supabase.co" required></label>
    <label>Anon / publishable key<input name="key" required></label>
    <button class="btn primary full">Salva</button>
  </form>
</div>

<!-- ============ LOGIN ============ -->
<div id="auth" class="center hidden">
  <form class="box" id="auth-form">
    <span class="logo">€</span>
    <h1>Track your payments</h1>
    <p class="muted">Entrate, uscite, rate e abbonamenti in un posto solo.</p>
    <label>Email<input id="a-email" type="email" autocomplete="email" required></label>
    <label>Password<input id="a-pass" type="password" autocomplete="current-password" minlength="6" required></label>
    <button class="btn primary full" data-mode="in">Accedi</button>
    <button class="btn full" data-mode="up" type="button" id="btn-signup">Crea account</button>
    <div id="auth-msg"></div>
    <p style="margin:16px 0 0"><button class="link" type="button" id="reset-cfg">Cambia progetto Supabase</button></p>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="logo">€</span><span class="bfull">Track your payments</span></div>
      <div class="month">
        <button data-act="prev" aria-label="Mese precedente">‹</button>
        <span id="month-label" data-act="today" title="Torna al mese corrente"></span>
        <button data-act="next" aria-label="Mese successivo">›</button>
      </div>
      <button class="ghost" data-act="logout" title="Esci">Esci</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-tab="panoramica"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><span class="tl">Panoramica</span></button>
      <button data-act="tab" data-tab="movimenti"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"/></svg></span><span class="tl">Movimenti</span></button>
      <button data-act="tab" data-tab="rate"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg></span><span class="tl">Rate</span></button>
      <button data-act="tab" data-tab="abbonamenti"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></span><span class="tl">Abbonamenti</span></button>
      <button data-act="tab" data-tab="calendario"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span class="tl">Calendario</span></button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<div id="modal" class="modal hidden"><div class="sheet">
  <div class="sheet-head"><h3 id="m-title"></h3><button class="icon" data-act="close">✕</button></div>
  <div id="m-body"></div>
</div></div>
<div id="toast" class="hidden"></div>

<datalist id="cat-list">
  <option value="Stipendio"><option value="Musica / Freelance"><option value="Rimborsi"><option value="Regali">
  <option value="Casa"><option value="Bollette"><option value="Spesa"><option value="Trasporti"><option value="Auto">
  <option value="Ristoranti"><option value="Svago"><option value="Shopping"><option value="Salute">
  <option value="Abbonamenti"><option value="Rate"><option value="Studio / Attrezzatura"><option value="Altro">
</datalist>

<script>
// =====================================================================
//  CONFIGURAZIONE — incolla qui i dati del tuo progetto Supabase
//  (se li lasci vuoti l'app te li chiederà al primo avvio)
// =====================================================================
const SUPABASE_URL = 'https://jsvpvfyqqfikbudknbpd.supabase.co';        // es. 'https://abcdefgh.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_caQGfBBAF4EEp5dEXP3JhA_A-zPDbu3';   // anon / publishable key (è pubblica, i dati sono protetti dalle policy RLS)

// ---------------------------------------------------------------------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'});
const eur = n => EUR.format(n || 0);
const compact = new Intl.NumberFormat('it-IT', {notation:'compact', maximumFractionDigits:1});
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dim = (y, m) => new Date(y, m+1, 0).getDate();      // giorni nel mese (m 0-based)
const mIdx = (y, m) => y*12 + m;
const todayISO = () => iso(new Date());
const sum = a => a.reduce((s, x) => s + x, 0);
const fmtDate = (s, year=false) => parse(s).toLocaleDateString('it-IT', year ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'});
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}, del:k=>{try{localStorage.removeItem(k)}catch{}} };

let sb = null;
const S = { mov:[], rate:[], abb:[] };
const NOW = new Date();
let cur = { y: NOW.getFullYear(), m: NOW.getMonth() };
let tab = store.get('typ_tab') || 'panoramica';
let movFilter = 'tutti';
let calOcc = [];
const charts = {};

// ---------------- UI helpers ----------------
function show(id){ ['setup','auth','app'].forEach(x => $('#'+x).classList.toggle('hidden', x !== id)); }
let toastT;
function toast(msg, err=false){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'), 3500); }
function openModal(title, html){ $('#m-title').textContent=title; $('#m-body').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#m-body').innerHTML=''; }
async function q(p){ const {data, error} = await p; if(error) throw error; return data; }

function fieldHtml(f){
  if(f.type === 'html') return f.html;
  const v = f.value ?? '';
  if(f.type === 'select')
    return `<label>${f.label}<select name="${f.name}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
  return `<label>${f.label}<input name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${f.list?`list="${f.list}"`:''} ${f.attrs||''}></label>`;
}
function formModal(title, fields, onSave, extraBtns = ''){
  openModal(title, `<form id="mf">${fields.map(fieldHtml).join('')}<div class="row-btns">${extraBtns}<button class="btn" type="button" data-act="close">Annulla</button><button class="btn primary" type="submit">Salva</button></div></form>`);
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    try { await onSave(Object.fromEntries(new FormData(e.target))); closeModal(); await refresh(); toast('Salvato ✓'); }
    catch(err){ toast(err.message || String(err), true); btn.disabled = false; }
  };
}

// ---------------- Avvio / login ----------------
function cfg(){ return { url: SUPABASE_URL || store.get('typ_url') || '', key: SUPABASE_ANON_KEY || store.get('typ_key') || '' }; }

async function init(){
  const {url, key} = cfg();
  if(!url || !key){ show('setup'); return; }
  sb = supabase.createClient(url, key);
  sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT') show('auth'); });
  const { data:{ session } } = await sb.auth.getSession();
  if(session) enter(); else show('auth');
}

$('#setup-form').onsubmit = e => {
  e.preventDefault(); const fd = new FormData(e.target);
  store.set('typ_url', fd.get('url').trim().replace(/\/$/, '')); store.set('typ_key', fd.get('key').trim());
  location.reload();
};
$('#reset-cfg').onclick = () => { store.del('typ_url'); store.del('typ_key'); location.reload(); };

async function doAuth(mode){
  const email = $('#a-email').value.trim(), password = $('#a-pass').value, msg = $('#auth-msg');
  if(!email || password.length < 6){ msg.innerHTML = '<span class="red">Inserisci email e una password di almeno 6 caratteri.</span>'; return; }
  msg.textContent = '…';
  const { data, error } = mode === 'up'
    ? await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + location.pathname } })
    : await sb.auth.signInWithPassword({ email, password });
  if(error){ msg.innerHTML = `<span class="red">${esc(error.message)}</span>`; return; }
  if(mode === 'up' && !data.session){ msg.innerHTML = '<span class="green">Account creato! Conferma dal link nella tua email, poi accedi.</span>'; return; }
  msg.textContent = '';
  enter();
}
$('#auth-form').onsubmit = e => { e.preventDefault(); doAuth('in'); };
$('#btn-signup').onclick = () => doAuth('up');

async function enter(){
  show('app');
  $('#view').innerHTML = '<p class="empty">Caricamento…</p>';
  await refresh();
}

async function fetchAll(table, order, asc=true){
  let out = [], from = 0;
  while(true){
    const data = await q(sb.from(table).select('*').order(order, {ascending:asc}).range(from, from+999));
    out = out.concat(data);
    if(data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function refresh(){
  try{
    const [m, r, a] = await Promise.all([fetchAll('movimenti','data',false), fetchAll('rate','data_prima_rata'), fetchAll('abbonamenti','nome')]);
    S.mov  = m.map(x => ({...x, importo:+x.importo}));
    S.rate = r.map(x => ({...x, importo_rata:+x.importo_rata}));
    S.abb  = a.map(x => ({...x, importo:+x.importo}));
  }catch(err){ toast('Errore nel caricamento: ' + err.message, true); }
  render();
}

// ---------------- Logica scadenze ----------------
function rataDate(r, n){            // data della rata n (0-based)
  const s = parse(r.data_prima_rata);
  const b = new Date(s.getFullYear(), s.getMonth() + n, 1);
  return iso(new Date(b.getFullYear(), b.getMonth(), Math.min(s.getDate(), dim(b.getFullYear(), b.getMonth()))));
}
function abbDateIn(a, y, m){        // data di rinnovo dell'abbonamento nel mese y/m, o null
  const s = parse(a.data_inizio), si = mIdx(s.getFullYear(), s.getMonth()), idx = mIdx(y, m);
  if(idx < si) return null;
  const day = Math.min(a.giorno_rinnovo, dim(y, m));
  if(idx === si && day < s.getDate()) return null;
  const d = iso(new Date(y, m, day));
  if(a.data_fine && d > a.data_fine) return null;
  return d;
}
function occurrences(y, m){
  const out = [], idx = mIdx(y, m), today = todayISO();
  for(const r of S.rate){
    const s = parse(r.data_prima_rata), n = idx - mIdx(s.getFullYear(), s.getMonth());
    if(n < 0 || n >= r.num_rate) continue;
    const date = rataDate(r, n);
    const tx = S.mov.find(t => t.rata_id === r.id && t.scadenza === date);
    const pre = date <= today;                     // scadenza passata (o oggi) = pagata
    out.push({ kind:'rata', ref:r, date, importo:r.importo_rata, nome:r.nome, sub:`Rata ${n+1}/${r.num_rate}`, tx, pre, paid:!!tx || pre, overdue:!tx && !pre && date < today });
  }
  for(const a of S.abb){
    const date = abbDateIn(a, y, m); if(!date) continue;
    const tx = S.mov.find(t => t.abbonamento_id === a.id && t.scadenza === date);
    out.push({ kind:'abb', ref:a, date, importo:a.importo, nome:a.nome, sub:'Rinnovo mensile', tx, pre:false, paid:!!tx, overdue:!tx && date < today });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.nome.localeCompare(b.nome));
}
function rataStats(r){
  let paid = 0, next = null;
  for(let n = 0; n < r.num_rate; n++){
    const d = rataDate(r, n);
    const ok = d <= todayISO() || S.mov.some(t => t.rata_id === r.id && t.scadenza === d);
    if(ok) paid++; else if(!next) next = { d, n:n+1 };
  }
  return { paid, next, residuo:(r.num_rate - paid) * r.importo_rata, fine:rataDate(r, r.num_rate - 1) };
}
function nextRenewal(a){
  const t = new Date(), today = todayISO();
  for(let k = 0; k < 14; k++){
    const d = new Date(t.getFullYear(), t.getMonth() + k, 1), x = abbDateIn(a, d.getFullYear(), d.getMonth());
    if(x && x >= today) return x;
  }
  return null;
}
const abbAttivo = a => !a.data_fine || a.data_fine >= todayISO();
const prefix = (y, m) => `${y}-${pad(m+1)}`;
function monthTot(y, m){
  const p = prefix(y, m); let e = 0, u = 0;
  for(const t of S.mov) if(t.data.startsWith(p)) { if(t.tipo === 'entrata') e += t.importo; else u += t.importo; }
  return { e, u, d:e-u, pct: e > 0 ? u/e*100 : null };
}
const pctf = p => p.toLocaleString('it-IT', {maximumFractionDigits:1}) + '%';
const pctClass = p => p == null ? 'muted' : p < 70 ? 'green' : p < 90 ? 'orange' : 'red';

// ---------------- Render ----------------
function render(){
  $('#month-label').textContent = `${MESI[cur.m]} ${cur.y}`;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  Object.values(charts).forEach(c => c.destroy()); for(const k in charts) delete charts[k];
  const V = { panoramica:vPanoramica, movimenti:vMovimenti, rate:vRate, abbonamenti:vAbbonamenti, calendario:vCalendario };
  $('#view').innerHTML = (V[tab] || vPanoramica)();
  if(tab === 'panoramica') drawCharts();
}

// ---- Panoramica
function vPanoramica(){
  const t = monthTot(cur.y, cur.m), occ = occurrences(cur.y, cur.m), unpaid = occ.filter(o => !o.paid);
  const daPagare = sum(unpaid.map(o => o.importo)), prev = t.d - daPagare;
  const lvl = t.pct == null ? '' : t.pct < 70 ? '' : t.pct < 90 ? 'warn' : 'bad';
  const sgn = n => (n > 0 ? '+' : '') + eur(n);
  return `
  <section class="hero" aria-label="Saldo del mese">
    <div class="hero-top"><span>Saldo di ${MESI[cur.m].toLowerCase()} ${cur.y}</span>${t.pct == null ? '' : `<span class="hero-pill">${pctf(t.pct)} delle entrate speso</span>`}</div>
    <div class="hero-amt">${sgn(t.d)}</div>
    <div class="hero-bar"><i class="${lvl}" style="width:${Math.min(t.pct || 0, 100)}%"></i></div>
    <div class="hero-cap">${t.e > 0 ? `Hai speso ${eur(t.u)} su ${eur(t.e)} entrati` : 'Aggiungi le entrate del mese per vedere quanto spendi'}</div>
    <div class="hero-figs">
      <div><span>Entrate</span><b>${eur(t.e)}</b></div>
      <div><span>Uscite</span><b>${eur(t.u)}</b></div>
      <div><span>A fine mese</span><b>${sgn(prev)}</b></div>
    </div>
  </section>
  ${t.pct != null && t.pct > 100 ? `<div class="notice">Questo mese le uscite superano le entrate di ${eur(-t.d)}.</div>` : ''}
  <button class="due-strip" data-act="tab" data-tab="calendario">
    <span class="due-ic">${ICON_CAL}</span>
    <span class="grow">${unpaid.length ? `<b>${eur(daPagare)} da pagare</b><small>${unpaid.length} scadenze su ${occ.length} ancora aperte questo mese</small>` : `<b>Scadenze del mese saldate</b><small>${occ.length ? `Tutte le ${occ.length} scadenze sono pagate` : 'Nessuna rata o abbonamento questo mese'}</small>`}</span>
    <span class="chev">›</span>
  </button>
  <div class="grid2">
    <section class="card"><h3>Prossime scadenze</h3>${upcomingHtml()}</section>
    <section class="card"><h3>Dove vanno le uscite di ${MESI[cur.m].toLowerCase()}</h3><div class="chart">${t.u > 0 ? '<canvas id="c-cat"></canvas>' : '<p class="empty">Nessuna uscita registrata in questo mese</p>'}</div></section>
    <section class="card span2"><h3>Entrate e uscite negli ultimi 12 mesi</h3><div class="chart"><canvas id="c-trend"></canvas></div></section>
    <section class="card span2"><h3>Quanto spendi rispetto a quanto entra</h3><div class="chart"><canvas id="c-pct"></canvas></div></section>
  </div>`;
}
const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
function upcomingHtml(){
  const t = new Date(), today = todayISO(), lim = iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 35));
  let list = [];
  for(let k = -1; k <= 2; k++){ const d = new Date(t.getFullYear(), t.getMonth() + k, 1); list = list.concat(occurrences(d.getFullYear(), d.getMonth())); }
  list = list.filter(o => !o.paid && (o.overdue || o.date <= lim)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 7);
  if(!list.length) return '<p class="empty">Nessuna scadenza nei prossimi 35 giorni.</p>';
  calOcc = list;
  return list.map((o, i) => `<div class="row click" data-act="occ" data-i="${i}">
    <div class="dot ${o.overdue?'bg-red':o.kind==='rata'?'bg-orange':'bg-purple'}"></div>
    <div class="grow"><b>${esc(o.nome)}</b><small class="muted">${o.overdue?'<span class="red">Scaduta</span>, ':''}${fmtDate(o.date)}, ${esc(o.sub)}</small></div>
    <b>${eur(o.importo)}</b></div>`).join('');
}
function drawCharts(){
  Chart.defaults.color = '#7B8597'; Chart.defaults.borderColor = '#EEF1F5';
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const labels = [], E = [], U = [], D = [], P = [];
  for(let i = 11; i >= 0; i--){
    const d = new Date(cur.y, cur.m - i, 1), t = monthTot(d.getFullYear(), d.getMonth());
    labels.push(MESI[d.getMonth()].slice(0,3) + ' ' + String(d.getFullYear()).slice(2));
    E.push(t.e); U.push(t.u); D.push(+t.d.toFixed(2)); P.push(t.pct == null ? null : +t.pct.toFixed(1));
  }
  const base = { responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
    plugins:{ legend:{ labels:{ boxWidth:10, boxHeight:10 } } } };
  charts.trend = new Chart($('#c-trend'), { type:'bar', data:{ labels, datasets:[
      { label:'Entrate', data:E, backgroundColor:'#0B8A60', borderRadius:6, maxBarThickness:18, order:2 },
      { label:'Uscite', data:U, backgroundColor:'#F08A82', borderRadius:6, maxBarThickness:18, order:2 },
      { label:'Differenza', data:D, type:'line', borderColor:'#0E1630', backgroundColor:'#0E1630', borderWidth:2, tension:.35, pointRadius:2.5, order:1 } ] },
    options:{ ...base, plugins:{ ...base.plugins, tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${eur(c.parsed.y)}` } } },
      scales:{ y:{ ticks:{ callback:v => compact.format(v) + ' €' } }, x:{ grid:{ display:false } } } } });
  charts.pct = new Chart($('#c-pct'), { type:'line', data:{ labels, datasets:[
      { label:'Uscite su entrate', data:P, borderColor:'#2B59E8', backgroundColor:'rgba(43,89,232,.08)', borderWidth:2, fill:true, tension:.3, spanGaps:true, pointRadius:3 },
      { label:'Soglia 100%', data:labels.map(() => 100), borderColor:'rgba(210,63,54,.5)', borderDash:[5,5], pointRadius:0, fill:false } ] },
    options:{ ...base, plugins:{ ...base.plugins, tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${pctf(c.parsed.y)}` } } },
      scales:{ y:{ beginAtZero:true, suggestedMax:110, ticks:{ callback:v => v + '%' } }, x:{ grid:{ display:false } } } } });
  const cv = $('#c-cat');
  if(cv){
    const p = prefix(cur.y, cur.m), cat = {};
    S.mov.filter(t => t.tipo === 'uscita' && t.data.startsWith(p)).forEach(t => cat[t.categoria] = (cat[t.categoria] || 0) + t.importo);
    const ent = Object.entries(cat).sort((a, b) => b[1] - a[1]);
    const pal = ['#2B59E8','#6447D1','#E0A23A','#D23F36','#0B8A60','#14A3B8','#D86A9C','#8A94A6','#7C93F2','#B4532A','#5E6B85','#9CC08A'];
    const tot = sum(ent.map(e => e[1]));
    charts.cat = new Chart(cv, { type:'doughnut', data:{ labels:ent.map(e => e[0]), datasets:[{ data:ent.map(e => +e[1].toFixed(2)), backgroundColor:ent.map((_, i) => pal[i % pal.length]), borderWidth:2, borderColor:'#fff' }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:{ position: innerWidth < 600 ? 'bottom' : 'right', labels:{ boxWidth:10, boxHeight:10 } },
          tooltip:{ callbacks:{ label:c => `${c.label}: ${eur(c.parsed)} (${(c.parsed/tot*100).toFixed(1)}%)` } } } } });
  }
}

// ---- Movimenti

  const p = prefix(cur.y, cur.m), t = monthTot(cur.y, cur.m);
  const list = S.mov.filter(x => x.data.startsWith(p) && (movFilter === 'tutti' || x.tipo === movFilter))
    .sort((a, b) => b.data.localeCompare(a.data) || (b.created_at || '').localeCompare(a.created_at || ''));
  return `
  <div class="toolbar">
    <div class="mpick">
      <button data-act="prev" aria-label="Mese precedente">‹</button>

      <button data-act="next" aria-label="Mese successivo">›</button>
    </div>
  </div>
  <div class="toolbar">
    <button class="btn green" data-act="add-mov" data-tipo="entrata">+ Entrata</button>
    <button class="btn red" data-act="add-mov" data-tipo="uscita">+ Uscita</button>
    <select id="mov-filter">
      <option value="tutti" ${movFilter==='tutti'?'selected':''}>Tutti</option>
      <option value="entrata" ${movFilter==='entrata'?'selected':''}>Solo entrate</option>
      <option value="uscita" ${movFilter==='uscita'?'selected':''}>Solo uscite</option>
    </select>
  </div>
  <div class="card summary">
    <div><span class="muted small">Entrate</span><b class="green">${eur(t.e)}</b></div>
    <div><span class="muted small">Uscite</span><b class="red">${eur(t.u)}</b></div>
    <div><span class="muted small">Differenza</span><b class="${t.d>=0?'green':'red'}">${eur(t.d)}</b></div>

  <div class="card">${list.length ? list.map(rowMov).join('') : `<p class="empty">Nessun movimento in ${MESI[cur.m]} ${cur.y}.</p>`}</div>`;

const rowMov = t => `<div class="row click" data-act="edit-mov" data-id="${t.id}">
  <div class="av ${t.tipo}">${esc((t.descrizione || t.categoria || '?').trim().charAt(0).toUpperCase())}</div>
  <div class="grow"><b>${esc(t.descrizione || t.categoria)}</b>
    <small>${fmtDate(t.data)}, ${esc(t.categoria)}${t.rata_id?'<span class="badge">rata</span>':''}${t.abbonamento_id?'<span class="badge">abbonamento</span>':''}</small></div>
  <b class="amt ${t.tipo==='entrata'?'green':'red'}">${t.tipo==='entrata'?'+':'−'}${eur(t.importo)}</b>
  <button class="icon" data-act="edit-mov" data-id="${t.id}" title="Modifica">✎</button>
  <button class="icon" data-act="del-mov" data-id="${t.id}" title="Elimina">🗑</button></div>`;

function defaultDate(){ const n = new Date(); return (n.getFullYear() === cur.y && n.getMonth() === cur.m) ? todayISO() : iso(new Date(cur.y, cur.m, 1)); }
function movForm(tipo, t = {}){
  formModal(t.id ? 'Modifica movimento' : (tipo === 'entrata' ? 'Nuova entrata' : 'Nuova uscita'), [
    { name:'tipo', label:'Tipo', type:'select', value:t.tipo || tipo, options:[['entrata','Entrata'],['uscita','Uscita']] },
    { name:'importo', label:'Importo (€)', type:'number', value:t.importo, attrs:'step="0.01" min="0.01" inputmode="decimal" required autofocus' },
    { name:'data', label:'Data', type:'date', value:t.data || defaultDate(), attrs:'required' },
    { name:'categoria', label:'Categoria', value:t.categoria || (tipo === 'entrata' ? 'Stipendio' : ''), list:'cat-list', attrs:'required placeholder="es. Spesa"' },
    { name:'descrizione', label:'Descrizione', value:t.descrizione, attrs:'placeholder="opzionale"' }
  ], async fd => {
    const row = { tipo:fd.tipo, importo:+fd.importo, data:fd.data, categoria:fd.categoria.trim() || 'Altro', descrizione:fd.descrizione.trim() || null };
    if(t.id) await q(sb.from('movimenti').update(row).eq('id', t.id));
    else await q(sb.from('movimenti').insert(row));
  }, t.id ? `<button class="btn red left" type="button" data-act="del-mov" data-id="${t.id}">Elimina</button>` : '');
}

// ---- Rate
function vRate(){
  const st = S.rate.map(r => ({ r, s:rataStats(r) })).sort((a, b) => (!a.s.next) - (!b.s.next) || (a.s.next?.d || '').localeCompare(b.s.next?.d || ''));
  const attive = st.filter(x => x.s.next);
  const t = new Date(), mese = sum(occurrences(t.getFullYear(), t.getMonth()).filter(o => o.kind === 'rata').map(o => o.importo));
  return `
  <div class="toolbar"><button class="btn primary" data-act="add-rata">+ Nuovo pagamento rateizzato</button></div>
  <div class="card summary">
    <div><span class="muted small">Rateizzazioni attive</span><b>${attive.length}</b></div>
    <div><span class="muted small">Rate di questo mese</span><b class="orange">${eur(mese)}</b></div>
    <div><span class="muted small">Residuo totale da pagare</span><b class="red">${eur(sum(attive.map(x => x.s.residuo)))}</b></div>
  </div>
  ${st.length ? st.map(({r, s}) => {
    const pct = s.paid / r.num_rate * 100, today = todayISO();
    return `<div class="card rata ${s.next?'':'done'}">
      <div class="rata-head"><div><h3>${esc(r.nome)}</h3><small class="muted">${eur(r.importo_rata)} × ${r.num_rate} rate, totale ${eur(r.importo_rata * r.num_rate)}</small></div>
        <div style="white-space:nowrap"><button class="icon" data-act="edit-rata" data-id="${r.id}" title="Modifica">✎</button><button class="icon" data-act="del-rata" data-id="${r.id}" title="Elimina">🗑</button></div></div>
      <div class="bar big"><i class="${s.next?'bg-orange':'bg-green'}" style="width:${pct}%"></i></div>
      <div class="rata-stats">
        <span>Pagate ad oggi <b>${s.paid}/${r.num_rate}</b></span>
        <span>Restano <b>${r.num_rate - s.paid}</b> rate</span>
        <span>Residuo <b>${eur(s.residuo)}</b></span>
        <span>${s.next ? `Prossima (n.${s.next.n}): <b class="${s.next.d < today ? 'red' : ''}">${fmtDate(s.next.d, true)}</b>` : '<b class="green">✓ Completata</b>'}</span>
        <span>Ultima rata: <b>${fmtDate(s.fine, true)}</b></span>
      </div>${r.note ? `<p class="muted small" style="margin:10px 0 0">${esc(r.note)}</p>` : ''}</div>`;
  }).join('') : '<div class="card"><p class="empty">Nessun pagamento rateizzato. Aggiungine uno con il pulsante sopra.</p></div>'}
  <p class="muted small">Le rate con scadenza passata (o di oggi) sono considerate pagate in automatico. Dal <b>Calendario</b> puoi toccare una rata per registrarla anche come uscita nei movimenti, oppure pagarne una in anticipo.</p>`;
}
function rataForm(r = {}){
  formModal(r.id ? 'Modifica rateizzazione' : 'Nuovo pagamento rateizzato', [
    { name:'nome', label:'Nome', value:r.nome, attrs:'required placeholder="es. iPhone, finanziamento auto…"' },
    { name:'totale', label:'Importo totale (€)', type:'number', value:r.id ? +(r.importo_rata * r.num_rate).toFixed(2) : '', attrs:'step="0.01" min="0.01" inputmode="decimal" required placeholder="es. 1200"' },
    { name:'num_rate', label:'Numero di rate', type:'number', value:r.num_rate, attrs:'step="1" min="1" inputmode="numeric" required placeholder="es. 12"' },
    { name:'data_prima_rata', label:'Data della prima rata (le successive cadono lo stesso giorno di ogni mese)', type:'date', value:r.data_prima_rata || todayISO(), attrs:'required' },
    { type:'html', html:'<div id="rata-preview" class="occ-info"></div>' },
    { name:'note', label:'Note', value:r.note, attrs:'placeholder="opzionale"' }
  ], async fd => {
    const totale = +fd.totale, n = parseInt(fd.num_rate);
    if(!(totale > 0) || !(n > 0)) throw new Error('Inserisci importo totale e numero di rate.');
    const row = { nome:fd.nome.trim(), importo_rata:Math.round(totale / n * 100) / 100, num_rate:n, data_prima_rata:fd.data_prima_rata,
      rate_gia_pagate:0, note:fd.note.trim() || null };
    if(r.id) await q(sb.from('rate').update(row).eq('id', r.id));
    else await q(sb.from('rate').insert(row));
  }, r.id ? `<button class="btn red left" type="button" data-act="del-rata" data-id="${r.id}">Elimina</button>` : '');
  const f = $('#mf'), upd = () => {
    const tot = +f.totale.value, n = parseInt(f.num_rate.value), d = f.data_prima_rata.value, box = $('#rata-preview');
    if(!(tot > 0) || !(n > 0) || !d){ box.innerHTML = '<span class="muted small">Inserisci totale, numero di rate e data per vedere il calcolo.</span>'; return; }
    const tmp = { data_prima_rata:d, num_rate:n }, today = todayISO();
    let pagate = 0, prossima = null;
    for(let i = 0; i < n; i++){ const di = rataDate(tmp, i); if(di <= today) pagate++; else if(!prossima) prossima = di; }
    const rata = Math.round(tot / n * 100) / 100;
    box.innerHTML = `<div><span class="muted small">Importo di ogni rata</span><b style="font-size:20px">${eur(rata)}</b>
      <small class="muted">Pagate ad oggi: <b class="green">${pagate}</b>, Restano: <b class="orange">${n - pagate}</b> (${eur(rata * (n - pagate))})</small>
      <small class="muted">${prossima ? 'Prossima: ' + fmtDate(prossima, true) + ', ' : ''}Ultima: ${fmtDate(rataDate(tmp, n - 1), true)}</small></div>`;
  };
  f.addEventListener('input', upd); upd();
}

// ---- Abbonamenti
function vAbbonamenti(){
  const list = [...S.abb].sort((a, b) => abbAttivo(b) - abbAttivo(a) || a.nome.localeCompare(b.nome));
  const att = list.filter(abbAttivo), mese = sum(att.map(a => a.importo));
  return `
  <div class="toolbar"><button class="btn primary" data-act="add-abb">+ Nuovo abbonamento</button></div>
  <div class="card summary">
    <div><span class="muted small">Abbonamenti attivi</span><b>${att.length}</b></div>
    <div><span class="muted small">Costo mensile</span><b class="purple" style="color:var(--purple)">${eur(mese)}</b></div>
    <div><span class="muted small">Costo annuale</span><b class="red">${eur(mese * 12)}</b></div>
  </div>
  <div class="card">${list.length ? list.map(a => {
    const on = abbAttivo(a), nx = on ? nextRenewal(a) : null;
    return `<div class="row click" data-act="edit-abb" data-id="${a.id}">
      <div class="dot ${on?'bg-purple':'bg-muted'}"></div>
      <div class="grow"><b>${esc(a.nome)}</b><small class="muted">${esc(a.categoria)}, il ${a.giorno_rinnovo} di ogni mese${nx ? `, prossimo: ${fmtDate(nx)}` : ''}${!on ? `, disdetto dal ${fmtDate(a.data_fine, true)}` : ''}</small></div>
      <span class="tag ${on?'ok':'off'}">${on?'Attivo':'Disdetto'}</span>
      <b class="amt">${eur(a.importo)}</b>
      <button class="icon" data-act="edit-abb" data-id="${a.id}" title="Modifica">✎</button>
      <button class="icon" data-act="toggle-abb" data-id="${a.id}" title="${on?'Disdici':'Riattiva'}">${on?'⏸':'▶'}</button>
      <button class="icon" data-act="del-abb" data-id="${a.id}" title="Elimina">🗑</button></div>`;
  }).join('') : '<p class="empty">Nessun abbonamento. Aggiungi Netflix, Spotify & co. con il pulsante sopra.</p>'}</div>`;
}
function abbForm(a = {}){
  formModal(a.id ? 'Modifica abbonamento' : 'Nuovo abbonamento', [
    { name:'nome', label:'Nome', value:a.nome, attrs:'required placeholder="es. Netflix"' },
    { name:'importo', label:'Costo mensile (€)', type:'number', value:a.importo, attrs:'step="0.01" min="0.01" inputmode="decimal" required' },
    { name:'giorno_rinnovo', label:'Giorno del rinnovo (1–31)', type:'number', value:a.giorno_rinnovo || new Date().getDate(), attrs:'step="1" min="1" max="31" required' },
    { name:'data_inizio', label:'Attivo dal', type:'date', value:a.data_inizio || todayISO(), attrs:'required' },
    { name:'categoria', label:'Categoria', value:a.categoria || 'Abbonamenti', list:'cat-list' },
    { name:'data_fine', label:'Disdetto il (lascia vuoto se attivo)', type:'date', value:a.data_fine }
  ], async fd => {
    const row = { nome:fd.nome.trim(), importo:+fd.importo, giorno_rinnovo:parseInt(fd.giorno_rinnovo), data_inizio:fd.data_inizio,
      categoria:fd.categoria.trim() || 'Abbonamenti', data_fine:fd.data_fine || null };
    if(a.id) await q(sb.from('abbonamenti').update(row).eq('id', a.id));
    else await q(sb.from('abbonamenti').insert(row));
  }, a.id ? `<button class="btn red left" type="button" data-act="del-abb" data-id="${a.id}">Elimina</button>
    <button class="btn" type="button" data-act="toggle-abb" data-id="${a.id}">${abbAttivo(a) ? '⏸ Disdici' : '▶ Riattiva'}</button>` : '');
}

// ---- Calendario
function vCalendario(){
  const y = cur.y, m = cur.m, occ = occurrences(y, m); calOcc = occ;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, days = dim(y, m), today = todayISO();
  let cells = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d => `<div class="wd">${d}</div>`).join('');
  for(let i = 0; i < offset; i++) cells += '<div class="cell empty"></div>';
  for(let d = 1; d <= days; d++){
    const ds = iso(new Date(y, m, d));
    const ev = occ.map((o, i) => [o, i]).filter(([o]) => o.date === ds);
    cells += `<div class="cell ${ds === today ? 'today' : ''}"><span class="dn">${d}</span><div class="chips">${ev.map(([o, i]) =>
      `<button class="chip ${o.kind} ${o.paid ? 'paid' : o.overdue ? 'overdue' : ''}" data-act="occ" data-i="${i}" title="${esc(o.nome)}, ${eur(o.importo)}">${o.paid ? '✓ ' : ''}${esc(o.nome)}</button>`).join('')}</div></div>`;
  }
  const pagato = sum(occ.filter(o => o.paid).map(o => o.importo)), daP = sum(occ.filter(o => !o.paid).map(o => o.importo));
  return `
  <div class="card">
    <div class="cal">${cells}</div>
    <div class="legend">
      <span><i class="dot bg-orange"></i>Rata</span><span><i class="dot bg-purple"></i>Abbonamento</span>
      <span><i class="dot bg-red"></i>Scaduta, non pagata</span><span><i class="dot bg-muted"></i>✓ Pagata</span>
    </div>
  </div>
  <div class="card summary">
    <div><span class="muted small">Scadenze del mese</span><b>${eur(pagato + daP)}</b></div>
    <div><span class="muted small">Già pagate</span><b class="green">${eur(pagato)}</b></div>
    <div><span class="muted small">Da pagare</span><b class="orange">${eur(daP)}</b></div>
  </div>
  <div class="card"><h3>Tutte le scadenze di ${MESI[m]}</h3>${occ.length ? occ.map((o, i) => `<div class="row click" data-act="occ" data-i="${i}">
    <div class="dot ${o.paid ? 'bg-muted' : o.overdue ? 'bg-red' : o.kind === 'rata' ? 'bg-orange' : 'bg-purple'}"></div>
    <div class="grow"><b>${esc(o.nome)}</b><small class="muted">${fmtDate(o.date)}, ${esc(o.sub)}</small></div>
    <span class="tag ${o.paid ? 'ok' : o.overdue ? 'off' : ''}">${o.paid ? 'Pagata' : o.overdue ? 'Scaduta' : 'Da pagare'}</span>
    <b>${eur(o.importo)}</b></div>`).join('') : '<p class="empty">Nessuna scadenza in questo mese.</p>'}</div>`;
}
function occModal(o){
  let html = `<div class="occ-info"><div><span class="muted small">${o.kind === 'rata' ? 'Rata' : 'Abbonamento'}</span><b>${esc(o.nome)}</b>
    <small class="muted">${esc(o.sub)}, scadenza ${fmtDate(o.date, true)}</small></div><b>${eur(o.importo)}</b></div>`;
  const preNote = o.pre ? `<p class="green" style="margin-top:0">✓ Considerata pagata: la scadenza è già passata.</p>` : '';
  if(o.tx){
    openModal('Scadenza', html + `<p class="green">✓ Pagata il ${fmtDate(o.tx.data, true)} (${eur(o.tx.importo)})</p>
      <div class="row-btns"><button class="btn red" data-act="unpay" data-id="${o.tx.id}">${o.pre ? 'Rimuovi l\'uscita dai movimenti' : 'Segna come non pagata'}</button></div>`); return;
  }
  openModal('Scadenza', html + preNote + `<form id="payf"><div class="two">
      <label>Importo pagato (€)<input name="importo" type="number" step="0.01" min="0.01" value="${o.importo}" required></label>
      <label>Data pagamento<input name="data" type="date" value="${o.date}" required></label></div>
    <p class="muted small" style="margin-top:0">Verrà registrata un'uscita nei movimenti di quel mese.</p>
    <div class="row-btns"><button class="btn" type="button" data-act="close">Annulla</button><button class="btn green" type="submit">${o.pre ? 'Registra l\'uscita nei movimenti' : '✓ Segna come pagata'}</button></div></form>`);
  $('#payf').onsubmit = async e => {
    e.preventDefault(); const btn = e.submitter; btn.disabled = true;
    const fd = Object.fromEntries(new FormData(e.target));
    try{
      await q(sb.from('movimenti').insert({
        tipo:'uscita', importo:+fd.importo, data:fd.data,
        categoria: o.kind === 'rata' ? 'Rate' : (o.ref.categoria || 'Abbonamenti'),
        descrizione: o.kind === 'rata' ? `${o.nome} – ${o.sub}` : o.nome,
        rata_id: o.kind === 'rata' ? o.ref.id : null, abbonamento_id: o.kind === 'abb' ? o.ref.id : null, scadenza:o.date }));
      closeModal(); await refresh(); toast('Pagamento registrato ✓');
    }catch(err){ toast(err.message, true); btn.disabled = false; }
  };
}

// ---------------- Azioni ----------------
const byId = (arr, id) => arr.find(x => x.id === id);
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const { act, id } = b.dataset;
  try{
    switch(act){
      case 'tab': tab = b.dataset.tab; store.set('typ_tab', tab); render(); window.scrollTo(0, 0); break;
      case 'prev': { const d = new Date(cur.y, cur.m - 1, 1); cur = { y:d.getFullYear(), m:d.getMonth() }; render(); break; }
      case 'next': { const d = new Date(cur.y, cur.m + 1, 1); cur = { y:d.getFullYear(), m:d.getMonth() }; render(); break; }
      case 'today': { const n = new Date(); cur = { y:n.getFullYear(), m:n.getMonth() }; render(); break; }
      case 'logout': await sb.auth.signOut(); break;
      case 'close': closeModal(); break;
      case 'add-mov': movForm(b.dataset.tipo); break;
      case 'edit-mov': { const t = byId(S.mov, id); movForm(t.tipo, t); break; }
      case 'del-mov':
        if(!confirm('Eliminare questo movimento?')) return;
        await q(sb.from('movimenti').delete().eq('id', id)); closeModal(); await refresh(); toast('Eliminato'); break;
      case 'add-rata': rataForm(); break;
      case 'edit-rata': rataForm(byId(S.rate, id)); break;
      case 'del-rata':
        if(!confirm('Eliminare questa rateizzazione? I pagamenti già registrati resteranno tra i movimenti.')) return;
        await q(sb.from('rate').delete().eq('id', id)); closeModal(); await refresh(); toast('Eliminata'); break;
      case 'add-abb': abbForm(); break;
      case 'edit-abb': abbForm(byId(S.abb, id)); break;
      case 'toggle-abb': {
        const a = byId(S.abb, id), on = abbAttivo(a);
        if(on && !confirm(`Segnare ${a.nome} come disdetto da oggi?`)) return;
        await q(sb.from('abbonamenti').update({ data_fine: on ? todayISO() : null }).eq('id', id)); closeModal(); await refresh(); toast(on ? 'Disdetto' : 'Riattivato'); break;
      }
      case 'del-abb':
        if(!confirm('Eliminare questo abbonamento? I pagamenti già registrati resteranno tra i movimenti.')) return;
        await q(sb.from('abbonamenti').delete().eq('id', id)); closeModal(); await refresh(); toast('Eliminato'); break;
      case 'occ': occModal(calOcc[+b.dataset.i]); break;
      case 'unpay':
        if(!confirm('Annullare il pagamento? L\'uscita collegata verrà eliminata.')) return;
        await q(sb.from('movimenti').delete().eq('id', id)); closeModal(); await refresh(); toast('Pagamento annullato'); break;
    }
  }catch(err){ toast(err.message || String(err), true); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'mov-filter'){ movFilter = e.target.value; render(); }
  if(e.target.id === 'mov-month' && e.target.value){ const [y, m] = e.target.value.split('-').map(Number); cur = { y, m:m-1 }; render(); }
});
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

init();
</script>
