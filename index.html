<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C47D3">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Track Your Payments</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payments">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar fissa a sinistra su desktop, bottom nav su mobile; contenuto a card con gerarchia "riepilogo prima del dettaglio". */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#141725; --ink-2:#464C64; --muted:#767C94; --line:#E1E4EE; --line-2:#EEF0F5;
  --accent:#2C47D3; --accent-ink:#FFFFFF; --accent-soft:#E6EAFC;
  --c-rata:#2C47D3; --c-sub:#7B4ED8; --c-altro:#0C8A80;
  --c-rata-soft:#E6EAFC; --c-sub-soft:#EFE8FB; --c-altro-soft:#DFF3F1;
  --s-paid:#167A3E; --s-paid-bg:#E1F4E7; --s-due:#B85A08; --s-due-bg:#FCEDD9; --s-over:#C42E2A; --s-over-bg:#FBE2E1; --s-fut:#646A80; --s-fut-bg:#ECEEF4;
  --shadow:0 1px 2px rgba(20,24,40,.05),0 10px 30px -18px rgba(20,24,40,.25);
  --overlay:rgba(14,16,28,.42);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F17; --surface:#161925; --surface-2:#1B1F2D; --ink:#ECEEF6; --ink-2:#B7BCCF; --muted:#878DA4; --line:#272B3C; --line-2:#202434;
  --accent:#8297FF; --accent-ink:#0D0F17; --accent-soft:#1E2649;
  --c-rata:#8297FF; --c-sub:#B597F7; --c-altro:#3DC6B9;
  --c-rata-soft:#1E2649; --c-sub-soft:#2A2145; --c-altro-soft:#123330;
  --s-paid:#5ED98A; --s-paid-bg:#12301F; --s-due:#F3A650; --s-due-bg:#3A2911; --s-over:#F77E7A; --s-over-bg:#3C1818; --s-fut:#9CA1B6; --s-fut-bg:#232737;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6); --overlay:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F17; --surface:#161925; --surface-2:#1B1F2D; --ink:#ECEEF6; --ink-2:#B7BCCF; --muted:#878DA4; --line:#272B3C; --line-2:#202434;
  --accent:#8297FF; --accent-ink:#0D0F17; --accent-soft:#1E2649;
  --c-rata:#8297FF; --c-sub:#B597F7; --c-altro:#3DC6B9;
  --c-rata-soft:#1E2649; --c-sub-soft:#2A2145; --c-altro-soft:#123330;
  --s-paid:#5ED98A; --s-paid-bg:#12301F; --s-due:#F3A650; --s-due-bg:#3A2911; --s-over:#F77E7A; --s-over-bg:#3C1818; --s-fut:#9CA1B6; --s-fut-bg:#232737;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6); --overlay:rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.15;min-width:0}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--s-over-bg);color:var(--s-over);padding:1px 8px;border-radius:99px}
.side-add{margin:10px 0 6px}
.side-foot{margin-top:auto;padding:10px 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.cloud{background:var(--s-paid)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:22px;font-weight:600;flex:none}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 38px}
.search .ico{position:absolute;left:11px;top:10px;color:var(--muted)}
.search input[type=search]{padding-left:38px}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px;z-index:40}
.results .grp{padding:8px 10px 4px}
.res{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:0;background:none;text-align:left}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.res .grow{flex:1;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--s-over);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.content{max-width:1200px;width:100%;margin:0 auto;padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

.bnav{display:none}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--s-over);border-color:color-mix(in srgb,var(--s-over) 40%,var(--line))}
.btn.ok{background:var(--s-paid);border-color:var(--s-paid);color:var(--surface)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-paid{background:var(--s-paid-bg);color:var(--s-paid)}
.st-due{background:var(--s-due-bg);color:var(--s-due)}
.st-overdue,.st-late{background:var(--s-over-bg);color:var(--s-over)}
.st-future{background:var(--s-fut-bg);color:var(--s-fut)}
.kind{font-size:12px;font-weight:600;padding:2px 8px;border-radius:7px;white-space:nowrap}
.k-rata{background:var(--c-rata-soft);color:var(--c-rata)}
.k-sub{background:var(--c-sub-soft);color:var(--c-sub)}
.k-altro{background:var(--c-altro-soft);color:var(--c-altro)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel-h h2{font-size:18px;font-weight:600}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .eyebrow,.kpi.hero .sub{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.hbar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden;margin-top:8px}
.hbar i{display:block;height:100%;border-radius:99px;background:var(--accent-ink);min-width:0;transition:width .4s ease}
.hbar-l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:color-mix(in srgb,var(--accent-ink) 78%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar-l b{color:var(--accent-ink);font-weight:700}
.kpi-sub{background:var(--c-sub-soft);border-color:color-mix(in srgb,var(--c-sub) 30%,var(--line))}
.kpi-sub .val{color:var(--c-sub)}
.kpi .val small{font-family:var(--f-body);font-size:14px;font-weight:600;letter-spacing:0;opacity:.75}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-btn{text-align:left;cursor:pointer}
.kpi-btn:hover{border-color:var(--muted)}

.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--s-due-bg);color:var(--s-due);font-weight:600;font-size:14px;flex-wrap:wrap}
.alert.red{background:var(--s-over-bg);color:var(--s-over)}
.alert .link{color:inherit;text-decoration:underline;margin-left:auto;flex:none}
.alert{flex-wrap:nowrap}
.alert>svg{flex:none}
.al-t{flex:1;min-width:0}
.al-short{display:none}
@media (max-width:700px){
  .alert{padding:10px 14px;gap:10px;font-size:13.5px;border-radius:12px}
  .al-long{display:none}
  .al-short{display:inline}
  .alert>svg{width:17px;height:17px}
}

/* payment rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:11px 8px;border-top:1px solid var(--line-2);border-radius:10px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.rows .row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.dbox{display:flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;border-radius:12px;background:var(--surface-2);line-height:1}
.dbox b{font-family:var(--f-display);font-size:19px;font-weight:600}
.dbox span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.dbox.st-overdue,.dbox.st-late{background:var(--s-over-bg)} .dbox.st-due{background:var(--s-due-bg)} .dbox.st-paid{background:var(--s-paid-bg)}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.paid-amt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}

.insight{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.insight:first-child{border-top:0;padding-top:0}
.insight .ib{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.insight .ib .ico{width:16px;height:16px}
.insight p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.insight strong{color:var(--ink)}

.horizon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hz{padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left}
.hz b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.hz span{font-size:12px;color:var(--muted)}

/* rate cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.icard.dim{opacity:.62}
.ic-head{display:flex;gap:12px;align-items:flex-start}
.logo,.logo-fb{display:inline-grid;place-items:center;flex:none;vertical-align:-4px;overflow:hidden}
.logo{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.logo img{width:72%;height:72%;object-fit:contain;display:block}
.logo-fb{font-family:var(--f-display);font-weight:700;background:var(--c-sub-soft);color:var(--c-sub)}
.logo-fb.k-altro{background:var(--c-altro-soft);color:var(--c-altro)}
.logo-fb.k-rata{background:var(--c-rata-soft);color:var(--c-rata)}
.ic-logo-wrap{display:flex;flex:none}
.via-split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line-2);gap:2px;margin:2px 0 16px}
.via-split i{display:block;height:100%}
.via-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.via-col{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2)}
.via-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.via-h .logo{vertical-align:0}
.via-h b{font-weight:600;font-size:15px}
.via-pct{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.via-dot{width:28px;height:28px;border-radius:8px;background:var(--line);flex:none}
.via-big{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.via-big small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.via-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line-2)}
.via-row span{color:var(--muted)}
.via-row b{font-weight:600}
.via-dot{background:var(--muted);opacity:.35}
@media (max-width:700px){.via-cols{gap:8px}.via-col{padding:11px 12px}.via-h{margin-bottom:4px}.via-h .logo{width:24px!important;height:24px!important}.via-big{font-size:20px;margin-bottom:2px}.via-row{padding:3px 0;font-size:12.5px}}
.via-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.via-opt{position:relative;cursor:pointer}
.via-opt input{position:absolute;opacity:0;pointer-events:none}
.via-opt>span{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;color:var(--ink-2);transition:border-color .15s,background .15s}
.via-opt>span .logo{vertical-align:0}
.via-opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 1px var(--accent)}
.via-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.ic-logo-wrap .logo,.ic-logo-wrap .logo-fb{vertical-align:0}
.ic-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;font-family:var(--f-display);font-weight:700}
.ic-title{flex:1;min-width:0}
.ic-title h3{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-title .muted{font-size:13px}
.ic-price{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ic-price small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c-rata)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;font-size:13px}
.kv div span{display:block;color:var(--muted);font-size:12px}
.kv div b{font-weight:600;font-variant-numeric:tabular-nums}
.ic-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-2);padding-top:12px;font-size:13px}
.ic-foot{flex-wrap:wrap}
.ic-foot .grow{flex:1 1 200px;min-width:0}
.sumbar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.sumbar div span{display:block;font-size:12.5px;color:var(--muted)}
.sumbar div b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sumbar .btn{margin-left:auto}

.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-bar h2{font-size:22px;font-weight:600;text-transform:capitalize;margin-right:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--line)}
.month .wd{background:var(--surface-2);padding:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 1px 1px 0}
.cell{background:var(--surface);min-height:112px;padding:7px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;margin:0 1px 1px 0;min-width:0;cursor:pointer}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2)}
.cell.out .dn{color:var(--muted);opacity:.6}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:8px}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.chip{display:flex;gap:5px;align-items:center;font-size:11.5px;font-weight:600;padding:3px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;min-width:0;border:0;text-align:left;width:100%}
.chip .cn{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.chip .ca{font-variant-numeric:tabular-nums;opacity:.85}
.chip.paid{opacity:.55;text-decoration:line-through}
.chip.overdue,.chip.late{box-shadow:inset 0 0 0 1.5px var(--s-over)}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}
.daytot{display:none;font-size:10.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:220px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol.today{border-color:var(--accent)}
.wcol h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.wcol h4 b{color:var(--ink);font-family:var(--f-display);font-size:18px;letter-spacing:0}
.wtot{margin-top:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* payments */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .toggle-box{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 7px 0 11px;background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);min-width:0;cursor:pointer}
.toggle-box>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}
.today-mark{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.today-mark small{margin-left:auto;font-weight:500;font-size:12px;opacity:.8}
.month-h{display:flex;justify-content:space-between;align-items:baseline;padding:16px 8px 6px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:capitalize;border-bottom:1px solid var(--line)}
.month-h span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) auto 128px;gap:14px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line-2)}
.prow .open{border:0;background:none;padding:0;text-align:left;min-width:0;display:block}
.prow .open:hover .rname{color:var(--accent)}
select.status{height:30px;border-radius:99px;font-size:12.5px;font-weight:600;padding:0 26px 0 12px;border:0;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px;background-repeat:no-repeat}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* analysis */
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:620px;width:100%;height:auto}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-wrap svg{width:170px;height:170px;flex:none}
.dleg{display:flex;flex-direction:column;gap:10px;flex:1;min-width:160px}
.dleg div{display:flex;align-items:center;gap:10px;font-size:14px}
.dleg i{width:12px;height:12px;border-radius:4px}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums}
.bigstat{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line-2)}
.bigstat:first-of-type{border-top:0}
.bigstat span{font-size:13px;color:var(--muted)}
.bigstat b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.catrow{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px;padding:6px 0}
.catrow .bar i{background:var(--accent)}

table.inc{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.inc th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:1px solid var(--line)}
table.inc td{padding:6px 8px;border-bottom:1px solid var(--line-2)}
table.inc tr.cur td{background:var(--accent-soft)}
table.inc tbody tr{cursor:pointer}
table.inc tbody tr:hover td{background:var(--surface-2)}
table.inc tbody tr.cur:hover td{background:var(--accent-soft)}
.mlink{border:0;background:none;padding:4px 0;font-weight:600;text-transform:capitalize;display:inline-flex;align-items:center;gap:4px;color:var(--ink)}
.mlink .ico{width:14px;height:14px;color:var(--muted)}
.mlink:hover{color:var(--accent)}
svg .hit{cursor:pointer}
svg .hit:hover{fill:var(--line-2);fill-opacity:.5}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mstats div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.mstats span{display:block;font-size:12px;color:var(--muted)}
.mstats b{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mgauge{height:14px;border-radius:99px;background:var(--s-paid-bg);overflow:hidden;display:flex}
.mgauge i{display:block;height:100%}
.msec{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.msec h3{font-size:15px;font-weight:600}
@media (max-width:560px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
table.inc tfoot td{font-weight:700;border-bottom:0;padding-top:12px}
table.inc input{height:34px;max-width:130px;text-align:right;font-variant-numeric:tabular-nums}
/* upcoming */
.up-col h3{font-size:16px;font-weight:600}
.up-total{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 8px}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line-2);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row .lbl{min-width:0;flex:1 1 220px}
.set-row .lbl b{display:block;font-weight:600}
.set-row .lbl span{font-size:13px;color:var(--muted)}
.set-row select{width:auto;min-width:160px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500}
.tag.fixed{padding-right:11px}
.tag button{width:20px;height:20px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.tag button:hover{background:var(--line);color:var(--ink)}
.tag button .ico{width:13px;height:13px}
.inline-add{display:flex;gap:8px;margin-top:10px;max-width:420px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* modal */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s ease}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:560px;max-height:100%;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:680px}
.m-head{display:flex;align-items:center;gap:12px;padding:18px 20px 6px;position:sticky;top:0;background:var(--surface);z-index:2}
.m-head h2{font-size:20px;font-weight:600;flex:1;min-width:0}
.m-body{padding:10px 20px 20px;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 20px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.m-foot .left{margin-right:auto}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.detail-amt{font-family:var(--f-display);font-size:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;background:var(--surface-2);border-radius:14px;padding:14px}
.dlist div span{display:block;font-size:12px;color:var(--muted)}
.dlist div b{font-weight:600}
.dlist .full{grid-column:1/-1}
.rprev{display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-radius:14px;padding:14px 16px}
.rprev-empty{margin:0;font-size:13px;color:var(--muted)}
.rprev-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rprev-top span{display:block;font-size:12px;color:var(--muted)}
.rprev-top b{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.rprev-top em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.rprev-count{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.5}
.rprev-count b{color:var(--ink);font-weight:600}
.rprev-h{font-size:12px;color:var(--muted);font-weight:600;padding-top:10px;border-top:1px solid var(--line)}
.tl{list-style:none;margin:0;padding:0 4px 0 0;max-height:260px;overflow:auto}
.tl li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;position:relative;isolation:isolate}
.tl li::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl li:first-child::before{top:50%}
.tl li:last-child::before{bottom:50%}
.tl li:only-child::before{display:none}
.tl .pt{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid color-mix(in srgb,var(--muted) 45%,var(--line));position:relative;z-index:1;justify-self:center}
.tl li.paid .pt{background:var(--s-paid);border-color:var(--s-paid)}
.tl li.next .pt{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .tx b{display:block;font-size:13.5px;font-weight:600}
.tl .tx span{font-size:12px;color:var(--muted)}
.tl li.paid .tx b,.tl li.paid .am{color:var(--muted)}
.tl li.next .tx span{color:var(--accent);font-weight:600}
.tl .am{font-size:13.5px;font-weight:600;white-space:nowrap}
.emoji-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emoji-row button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:17px}
.kind-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kind-pick button{padding:12px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:600;font-size:14px}
.kind-pick button span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.kind-pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.more-list{display:flex;flex-direction:column;gap:4px}
.err{color:var(--s-over);font-size:13px;font-weight:600}
.code{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;box-shadow:var(--shadow);animation:pop .2s ease;max-width:calc(100% - 32px)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toast{animation:none}

/* ---------- responsive ---------- */
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:8px}
  .top h1{font-size:20px}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));gap:16px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
  .bnav button.on{color:var(--accent)}
  .bnav .fab{width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-22px auto 0;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
  .bnav .fab .ico{width:24px;height:24px}
  .search{max-width:none}
  .grid-3,.horizon{grid-template-columns:minmax(0,1fr)}
  .horizon{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cell{min-height:64px;padding:5px}
  .cell .chip,.cell .more{display:none}
  .dots{display:flex}
  .daytot{display:block}
  .week{grid-template-columns:minmax(0,1fr)}
  .wcol{min-height:0}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:22px 22px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:560px){
  .grid-4,.grid-2{grid-template-columns:minmax(0,1fr)}
  .kpi .val{font-size:26px}
  .search.collapsed{display:none}
  .row{grid-template-columns:52px minmax(0,1fr) auto;gap:10px}
  .row .st{display:none}
  .dbox{width:46px;height:46px}
  .prow{grid-template-columns:52px minmax(0,1fr) auto;gap:10px}
  .prow .sel-wrap{grid-column:2/-1;justify-self:start}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .kind-pick{grid-template-columns:minmax(0,1fr)}
  .horizon{grid-template-columns:minmax(0,1fr)}
  .sumbar .btn{margin-left:0;width:100%}
  .month .wd{padding:6px 2px;text-align:center;font-size:10px}
}
@media (min-width:561px){.search-toggle{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- wishlist ---------- */
.kpi .val.wl-green{color:var(--s-paid)}
.wl-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px}
.wl-bar input[type=search]{flex:1 1 200px;width:auto}
.wl-bar select{width:auto;flex:0 1 auto;max-width:100%}
.wl-chk{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;cursor:pointer}
.wl-chk input{width:16px;height:16px;accent-color:var(--accent)}
.wl-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.wl-card{padding:0;gap:0;overflow:hidden}
.wl-in{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.wl-thumb{position:relative;aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.wl-thumb img{width:100%;height:100%;object-fit:contain;padding:14px}
.wl-ph .ico{width:40px;height:40px;color:#B8BCCB;stroke-width:1.4}
.wl-badge{position:absolute;top:10px;left:10px;background:var(--s-over);color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1;padding:6px 9px;border-radius:9px;font-variant-numeric:tabular-nums}
.wl-prio{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px}
.wl-src{position:absolute;bottom:10px;right:10px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px 4px 7px;border-radius:99px;backdrop-filter:blur(4px)}
.wl-src .ico{width:13px;height:13px;stroke-width:2.2}
.wl-src.auto{background:color-mix(in srgb,var(--s-paid) 16%,#fff);color:#167A3E;box-shadow:inset 0 0 0 1px color-mix(in srgb,#167A3E 30%,transparent)}
.wl-src.man{background:#F3F4F8;color:#464C64;box-shadow:inset 0 0 0 1px #DADDE8}
.wl-done{position:absolute;bottom:10px;left:10px;background:var(--s-paid);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px}
.wl-card .ic-title h3{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;line-height:1.3}
.wl-desc{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wl-prices{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-top:auto}
.wl-was{text-decoration:line-through;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.wl-save{font-size:12.5px;font-weight:600;color:var(--s-paid)}
.wl-var{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.wl-var.down{color:var(--s-paid)}.wl-var.up{color:var(--s-over)}.wl-var.same{color:var(--muted)}
.wl-spark{display:block;width:100%;height:26px}
.wl-card .ic-foot{padding:10px 12px;gap:2px;border-top:1px solid var(--line-2)}
.wl-card .ic-foot .grow{flex:1 1 auto}
.wl-calc{display:flex;gap:8px 22px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.wl-calc b{color:var(--ink);font-variant-numeric:tabular-nums}

<script>
(function(){
"use strict";
/* ================= costanti ================= */
const DEFAULT_CATS=["Tecnologia","Auto","Casa","Intrattenimento","Streaming","Software","Telefonia","Assicurazioni","Finanziamenti","Shopping","Servizi","Altro"];
const DEFAULT_METHODS=["Carta di credito","Carta di debito","Conto corrente","PayPal","Contanti","Altro"];
const FREQ={weekly:{l:"Settimanale",short:"settimana",w:1},monthly:{l:"Mensile",short:"mese",m:1},bimonthly:{l:"Bimestrale",short:"2 mesi",m:2},quarterly:{l:"Trimestrale",short:"trimestre",m:3},semiannual:{l:"Semestrale",short:"6 mesi",m:6},yearly:{l:"Annuale",short:"anno",m:12},custom:{l:"Personalizzata",short:"giorni"}};
const KIND={rata:{l:"Rata",pl:"Rate"},sub:{l:"Subscription",pl:"Subscription"},altro:{l:"Spesa ricorrente",pl:"Altre spese ricorrenti"}};
const STATUS={paid:"Pagato",due:"In scadenza",overdue:"Scaduto",late:"In ritardo",future:"Futuro"};
const ITEM_STATUS={rata:{attiva:"Attiva",sospesa:"Sospesa",completata:"Completata"},sub:{attivo:"Attivo",pausa:"In pausa",cancellato:"Cancellato"},altro:{attivo:"Attivo",pausa:"In pausa",cancellato:"Cancellato"}};
const EMOJIS=["🎬","🎧","📦","🎨","☁️","📺","🎮","📱","💻","🚗","🏠","💡","🛡️","📰","🏋️","🍿","🎵","✈️","📚","💳"];
const MONTHS=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const MSHORT=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const WD=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const LS_KEY="scadenziere.v1";

/* ================= date (stringhe ISO YYYY-MM-DD, senza fusi) ================= */
const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parse=s=>{const a=s.split("-").map(Number);return{y:a[0],m:a[1],d:a[2]}};
const dim=(y,m)=>new Date(y,m,0).getDate();
const now=new Date();
const TODAY=iso(now.getFullYear(),now.getMonth()+1,now.getDate());
function addMonths(s,n,dom){const p=parse(s);const t=p.y*12+(p.m-1)+n;const y=Math.floor(t/12),m=t-y*12+1;return iso(y,m,Math.min(dom||p.d,dim(y,m)))}
function addDays(s,n){const p=parse(s);const d=new Date(Date.UTC(p.y,p.m-1,p.d+n));return d.toISOString().slice(0,10)}
function diffDays(a,b){const x=parse(a),y=parse(b);return Math.round((Date.UTC(y.y,y.m-1,y.d)-Date.UTC(x.y,x.m-1,x.d))/864e5)}
const monthKey=s=>s.slice(0,7);
const dow=s=>{const p=parse(s);return new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()};
function fmtDate(s,opt){const p=parse(s);const t=parse(TODAY);let r=`${p.d} ${MONTHS[p.m-1]}`;if((opt&&opt.year)||p.y!==t.y)r+=` ${p.y}`;return r}
const fmtShort=s=>{const p=parse(s);return `${p.d} ${MSHORT[p.m-1]}`};
function rel(s){const d=diffDays(TODAY,s);if(d===0)return"oggi";if(d===1)return"domani";if(d===-1)return"ieri";if(d>0)return`tra ${d} giorni`;return`${-d} giorni fa`}
function monthLabel(k){const[y,m]=k.split("-").map(Number);return `${MONTHS[m-1]} ${y}`}

/* ================= stato ================= */
let S=null;              // stato persistito
let C=null;              // cache calcolata
const UI={incYear:+TODAY.slice(0,4),view:"dashboard",cal:{mode:"month",cursor:TODAY,sel:TODAY},subTab:"sub",pf:{tab:"tutti",q:"",from:"",to:addMonths(TODAY,6),kind:"",cat:"",status:"",method:"",min:"",max:""},showFilters:false,search:"",searchOpen:false};
const store={mode:"local",ref:null,timer:null,downloads:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const cur=()=>S.settings.currency||"EUR";
const fmtCache={};
function money(v,c){c=c||cur();if(!fmtCache[c])fmtCache[c]=new Intl.NumberFormat("it-IT",{style:"currency",currency:c,minimumFractionDigits:2,maximumFractionDigits:2});return fmtCache[c].format(v||0)}
function moneyR(v){return new Intl.NumberFormat("it-IT",{style:"currency",currency:cur(),maximumFractionDigits:0}).format(Math.round(v||0))}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function blankState(){return{v:1,income:{},settings:{currency:"EUR",weekStart:1,theme:"system",notif:true,remindDefault:3},customCats:[],methods:DEFAULT_METHODS.slice(),items:[],payments:{},updatedAt:0}}

function demoState(){
  const st=blankState();const t=parse(TODAY);
  const mAgo=(n,day)=>{const tt=t.y*12+t.m-1-n;const y=Math.floor(tt/12),m=tt-y*12+1;return iso(y,m,Math.min(day,dim(y,m)))};
  const nextDom=day=>t.d<=day?mAgo(0,day):mAgo(-1,day);
  const R=(name,desc,amount,total,paid,day,cat,method,rem)=>({id:uid(),kind:"rata",demo:true,name,desc,amount,total,paidInit:paid,start:mAgo(paid,day),dom:day,freq:"monthly",finalAmount:null,category:cat,method,notes:"",status:"attiva",reminder:rem,emoji:""});
  const SB=(kind,name,emoji,amount,freq,anchor,since,cat,method,rem)=>({id:uid(),kind,demo:true,name,emoji,desc:"",amount,currency:"EUR",freq,anchor,since,end:"",category:cat,method,notes:"",status:"attivo",reminder:rem});
  st.items=[
    R("iPhone 16 Pro","Finanziamento a tasso zero",75,24,8,15,"Tecnologia","Carta di credito",3),
    R("Finanziamento auto","Rata mensile auto",280,48,14,20,"Auto","Conto corrente",7),
    R("PC portatile","Acquisto a rate",65,12,5,5,"Tecnologia","Carta di debito",3),
    SB("sub","Netflix","🎬",17.99,"monthly",nextDom(15),mAgo(26,15),"Streaming","Carta di credito",1),
    SB("sub","Spotify","🎧",10.99,"monthly",nextDom(22),mAgo(40,22),"Streaming","PayPal",0),
    SB("sub","Amazon Prime","📦",49.99,"yearly",mAgo(-4,3),mAgo(20,3),"Shopping","Carta di credito",7),
    SB("sub","Adobe","🎨",24.39,"monthly",nextDom(28),mAgo(10,28),"Software","Carta di credito",3),
    SB("sub","iCloud+","☁️",2.99,"monthly",nextDom(9),mAgo(30,9),"Software","Carta di credito",0),
    SB("altro","Assicurazione auto","🛡️",145,"quarterly",mAgo(-1,10),mAgo(11,10),"Assicurazioni","Conto corrente",7),
    SB("altro","Bolletta luce","💡",68,"bimonthly",nextDom(18),mAgo(8,18),"Casa","Conto corrente",3)
  ];
  st.demo=true;return st;
}

/* ================= persistenza ================= */
function lsGet(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function normalize(st){const b=blankState();st=Object.assign(b,st||{});st.settings=Object.assign(blankState().settings,st.settings||{});if(!Array.isArray(st.items))st.items=[];if(!st.payments||typeof st.payments!=="object")st.payments={};if(!Array.isArray(st.methods)||!st.methods.length)st.methods=DEFAULT_METHODS.slice();if(!Array.isArray(st.customCats))st.customCats=[];if(!st.income||typeof st.income!=="object")st.income={};for(const it of st.items){if(it.kind!=="rata"&&it.status==="pausa"){it.status="attivo";if(!(it.pauses||[]).length)it.pauses=[{from:TODAY,to:""}]}}return st}
function commit(msg){S.updatedAt=Date.now();C=null;lsSet();
  if(store.ref){clearTimeout(store.timer);store.timer=setTimeout(pushCloud,500)}
  render();if(msg)toast(msg)}
async function pushCloud(){store.timer=null;if(!store.ref)return;try{await store.ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt})}catch(e){
  if(e&&e.code==="unavailable"){setTimeout(pushCloud,3000+Math.random()*2000)}else{store.ref=null;store.mode="local";renderSide();toast("Salvataggio online non riuscito: i dati restano su questo dispositivo")}}}

/* ================= Supabase: accesso e sincronizzazione ================= */
const SUPABASE_URL="https://jsvpvfyqqfikbudknbpd.supabase.co";
const SUPABASE_KEY="sb_publishable_caQGfBBAF4EEp5dEXP3JhA_A-zPDbu3";
let sb=null;
const netErr=e=>!navigator.onLine||/fetch|network|timeout|load failed/i.test((e&&e.message)||"");
function supaRef(userId){return{
  async get(){const{data,error}=await sb.from("app_state").select("data,updated_ms").eq("user_id",userId).maybeSingle();if(error)throw error;return data},
  async set(v){try{const{error}=await sb.from("app_state").upsert({user_id:userId,data:JSON.parse(v.json),updated_ms:v.updatedAt,updated_at:new Date().toISOString()});if(error)throw error}
    catch(e){if(netErr(e))throw{code:"unavailable"};throw e}}
}}
const hasRealData=st=>!!st&&((st.items||[]).some(i=>!i.demo)||Object.keys(st.income||{}).length>0);
async function initCloud(user){
  try{
    const ref=supaRef(user.id);const remote=await ref.get();
    store.ref=ref;store.mode="cloud";store.email=user.email||"";
    if(remote&&remote.data&&(!hasRealData(S)||!S.updatedAt||+remote.updated_ms>=S.updatedAt)){
      S=normalize(remote.data);C=null;lsSet();applyTheme();render();
    }else{
      if(!hasRealData(S))S=normalize(blankState());   // primo accesso senza dati: si parte puliti
      S.updatedAt=S.updatedAt||Date.now();C=null;lsSet();render();await pushCloud();
    }
    listenRealtime(user.id);
    renderSide();
  }catch(e){store.ref=null;store.mode="local";renderSide();toast("Server non raggiungibile: per ora i dati restano su questo dispositivo")}
}
// applica i dati arrivati da un altro dispositivo, se più recenti di quelli che hai qui
function applyRemote(r){
  if(!r||!r.data||!(+r.updated_ms>S.updatedAt)||store.timer)return;
  S=normalize(r.data);C=null;lsSet();applyTheme();
  if(!document.querySelector("#itemForm")&&document.querySelector(".scrim"))closeModal();
  render();toast("Aggiornato da un altro dispositivo");
}
// in tempo reale: Supabase avvisa appena l'altro dispositivo salva
function listenRealtime(userId){
  if(store.channel)return;
  try{
    store.channel=sb.channel("app_state_"+userId)
      .on("postgres_changes",{event:"*",schema:"public",table:"app_state",filter:"user_id=eq."+userId},p=>applyRemote(p.new))
      .subscribe(st=>{const on=st==="SUBSCRIBED";if(!!store.unsub!==on){store.unsub=on;renderSide()}});
  }catch(e){store.channel=null}
}
// riserva: quando torni sull'app (o ogni minuto) ricontrolla comunque
async function pullCloud(){
  if(!store.ref||store.timer||document.visibilityState!=="visible")return;
  try{applyRemote(await store.ref.get())}catch(e){}
}
document.addEventListener("visibilitychange",pullCloud);
setInterval(pullCloud,60000);

async function doLogout(){
  if(store.timer){clearTimeout(store.timer);await pushCloud()}
  try{if(store.channel)await sb.removeChannel(store.channel)}catch(e){}
  try{await sb.auth.signOut()}catch(e){}
  try{localStorage.removeItem(LS_KEY)}catch(e){}
  location.reload();
}
async function startAuth(){
  const box=document.getElementById("auth"),msg=document.getElementById("authMsg");
  const $a=id=>document.getElementById(id);
  const say=(t,cls)=>{msg.textContent=t;msg.className="auth-msg "+(cls||"")};
  if(!window.supabase){render();toast("Accesso non disponibile: uso i dati di questo dispositivo");return}
  const hash=location.hash||"";
  let recovery=/type=recovery/.test(hash);
  const linkErr=/error_code=otp_expired|error=access_denied/.test(hash);
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const back=location.origin+location.pathname;
  const enter=user=>{box.hidden=true;render();initCloud(user)};
  const TXT={
    in:["Bentornato","Accedi per vedere le tue scadenze.","Accedi","Non hai un account?","Creane uno"],
    up:["Crea il tuo account","Ti servono solo email e password.","Crea account","Hai già un account?","Accedi"],
    forgot:["Reimposta la password","Scrivi la tua email: ti mandiamo un link per sceglierne una nuova.","Invia il link","Ti è tornata in mente?","Accedi"],
    newpass:["Scegli la nuova password","Almeno 6 caratteri. Dopo il salvataggio entri direttamente nell'app.","Salva la nuova password","",""]};
  let mode="in";
  const setMode=m=>{mode=m;say("");const t=TXT[m];
    $a("authTitle").textContent=t[0];$a("authSub").textContent=t[1];$a("authIn").textContent=t[2];
    $a("authSwitchTxt").textContent=t[3];$a("authUp").textContent=t[4];$a("authSwitch").hidden=m==="newpass";
    $a("authEmailWrap").hidden=m==="newpass";$a("authPassWrap").hidden=m==="forgot";
    $a("authForgot").hidden=m!=="in";$a("authPassLbl").textContent=m==="newpass"?"Nuova password":"Password";
    $a("authPass").setAttribute("autocomplete",m==="in"?"current-password":"new-password")};
  const busy=on=>{const btn=$a("authIn");if(on){btn.dataset.l=btn.textContent;btn.disabled=true;btn.textContent="Un momento…"}else{btn.disabled=false;btn.textContent=btn.dataset.l||btn.textContent}};
  const errIt=m=>m==="Invalid login credentials"?"Email o password non corrette. Riprova."
    :m==="User already registered"?"Esiste già un account con questa email: accedi."
    :/same.*password|different from the old/i.test(m)?"La nuova password deve essere diversa da quella vecchia."
    :/rate limit|security purposes/i.test(m)?"Hai chiesto troppi link in poco tempo: aspetta un minuto e riprova.":m;
  const go=async()=>{
    const email=$a("authEmail").value.trim(),password=$a("authPass").value;
    if(mode==="forgot"){
      if(!email){say("Scrivi l'email del tuo account.","err");return}
      busy(true);const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});busy(false);
      if(error){say(errIt(error.message),"err");return}
      say("Se esiste un account con questa email, ti è arrivato un link per reimpostare la password. Aprilo da questo dispositivo.","ok");return}
    if(mode==="newpass"){
      if(password.length<6){say("La password deve avere almeno 6 caratteri.","err");return}
      busy(true);const{data,error}=await sb.auth.updateUser({password});busy(false);
      if(error){say(errIt(error.message),"err");return}
      recovery=false;history.replaceState(null,"",back);toast("Password aggiornata");enter(data.user);return}
    if(!email||password.length<6){say("Inserisci la tua email e una password di almeno 6 caratteri.","err");return}
    busy(true);
    const{data,error}=mode==="up"?await sb.auth.signUp({email,password,options:{emailRedirectTo:back}})
                                 :await sb.auth.signInWithPassword({email,password});
    busy(false);
    if(error){say(errIt(error.message),"err");return}
    if(mode==="up"&&!data.session){setMode("in");say("Account creato. Apri il link che ti abbiamo mandato via email, poi accedi.","ok");return}
    say("");enter(data.user);
  };
  $a("authForm").addEventListener("submit",e=>{e.preventDefault();e.stopPropagation();go()});
  $a("authUp").addEventListener("click",()=>setMode(mode==="in"?"up":"in"));
  $a("authForgot").addEventListener("click",()=>{setMode("forgot");$a("authEmail").focus()});
  $a("authEye").addEventListener("click",e=>{const i=$a("authPass"),show=i.type==="password";
    i.type=show?"text":"password";e.currentTarget.textContent=show?"Nascondi":"Mostra";e.currentTarget.setAttribute("aria-label",show?"Nascondi password":"Mostra password")});
  const showNewPass=()=>{box.hidden=false;setMode("newpass");$a("authPass").value="";$a("authPass").focus()};
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"&&mode!=="newpass"){recovery=true;showNewPass()}});
  let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(recovery&&session){showNewPass();return}
  if(session){enter(session.user);return}
  box.hidden=false;setMode("in");
  if(linkErr){history.replaceState(null,"",back);setMode("forgot");say("Il link è scaduto o è già stato usato. Richiedine uno nuovo.","err")}
  $a("authEmail").focus();
}

/* ================= motore delle scadenze ================= */
const isRata=it=>it.kind==="rata";
// sospensioni: elenco di periodi {from,to}; "to" vuoto = finché non la riattivi
const pauseNow=it=>(it.pauses||[]).find(p=>p.from<=TODAY&&(!p.to||TODAY<p.to))||null;
const inPause=(it,d)=>(it.pauses||[]).some(p=>p.from<=d&&(!p.to||d<p.to));
const subStatus=it=>it.status==="cancellato"?"cancellato":pauseNow(it)?"pausa":"attivo";
function inactive(it){return isRata(it)?it.status==="sospesa":subStatus(it)!=="attivo"}
function stepDate(it,i){
  const base=isRata(it)?it.start:it.anchor;const f=FREQ[it.freq]||FREQ.monthly;
  if(f.m){const dom=isRata(it)?(+it.dom||parse(base).d):parse(base).d;return addMonths(base,i*f.m,dom)}
  if(f.w)return addDays(base,i*7);
  return addDays(base,i*Math.max(1,+it.customDays||30));
}
function monthlyEq(it){const f=FREQ[it.freq]||FREQ.monthly;const a=+it.amount||0;if(f.m)return a/f.m;if(f.w)return a*52/12;return a*365/12/Math.max(1,+it.customDays||30)}

const restartDates=it=>[...new Set((it.restarts||[]).map(r=>r.date).filter(Boolean))].sort();
function compute(){
  if(C)return C;
  const occ=[],byKey={},byItem={},seen=new Set();const until=addDays(TODAY,400);
  for(const it of S.items){
    const list=[];
    if(isRata(it)){const n=Math.max(0,Math.min(600,+it.total||0));for(let i=0;i<n;i++)list.push([i,stepDate(it,i)])}
    else{
      if(!it.anchor)continue;
      const since=it.since&&it.since<it.anchor?it.since:null;
      const R=restartDates(it);const cut=R[0]||null;
      if(since){const back=[];for(let i=-1;i>-400;i--){const d=stepDate(it,i);if(d<since)break;if(!cut||d<cut)back.push([i,d])}list.push(...back.reverse())}
      for(let i=0;i<1000;i++){const d=stepDate(it,i);if(d>until||(it.end&&d>it.end)||(cut&&d>=cut))break;list.push([i,d])}
      R.forEach((r,j)=>{const nx=R[j+1]||null;const seg=Object.assign({},it,{anchor:r});
        for(let i=0;i<1000;i++){const d=stepDate(seg,i);if(d>until||(it.end&&d>it.end)||(nx&&d>=nx))break;list.push([1000*(j+1)+i,d])}});
    }
    byItem[it.id]=[];
    for(const [i,d] of list){
      const key=it.id+"@"+d;if(seen.has(key))continue;
      let amount=+it.amount||0;if(isRata(it)&&i===(+it.total-1)&&it.finalAmount!=null&&it.finalAmount!=="")amount=+it.finalAmount;
      let implicit=isRata(it)?(i<(+it.paidInit||0)||(!!it.autopay&&d<=TODAY)):d<it.anchor;
      if(isRata(it)&&it.status==="completata")implicit=true;
      const rec=S.payments[key];
      let paid=rec?rec.status==="paid":implicit;
      if(!paid&&(isRata(it)?(inactive(it)&&d>=TODAY):(inPause(it,d)||(it.status==="cancellato"&&d>=(it.cancelledOn||TODAY)))))continue;
      seen.add(key);
      const o={key,item:it,itemId:it.id,idx:i,date:d,amount:(paid&&rec&&rec.amount!=null)?rec.amount:amount,name:it.name,kind:it.kind,category:it.category,method:it.method,notes:it.notes,emoji:it.emoji,via:it.via||"",implicit,rec,currency:it.currency||cur()};
      o.status=stat(o,paid,rec);occ.push(o);byKey[key]=o;byItem[it.id].push(o);
    }
  }
  // pagamenti registrati che non corrispondono più a una scadenza (es. dopo una modifica): restano nello storico
  for(const key in S.payments){const r=S.payments[key];if(seen.has(key)||r.status!=="paid")continue;
    const it=S.items.find(x=>x.id===r.itemId)||null;
    const o={key,item:it,itemId:r.itemId,idx:-1,date:r.date,amount:r.amount,name:r.name,kind:r.kind,category:r.category,method:r.method,notes:"",emoji:r.emoji||"",via:r.via||"",implicit:false,rec:r,orphan:true,currency:cur(),status:"paid"};
    occ.push(o);byKey[key]=o;if(byItem[r.itemId])byItem[r.itemId].push(o)}
  occ.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.name>b.name?1:-1));
  C={occ,byKey,byItem};return C;
}
function stat(o,paid,rec){if(paid)return"paid";if(rec&&rec.status==="late")return"late";if(o.date<TODAY)return"overdue";if(diffDays(TODAY,o.date)<=7)return"due";return"future"}
const unpaid=o=>o.status!=="paid";
function sum(arr){return arr.reduce((s,o)=>s+(+o.amount||0),0)}
function between(from,to){return compute().occ.filter(o=>o.date>=from&&o.date<=to)}
function upcoming(days){const to=addDays(TODAY,days);return compute().occ.filter(o=>unpaid(o)&&o.date>=TODAY&&o.date<=to)}
function overdueList(){return compute().occ.filter(o=>o.status==="overdue"||o.status==="late")}
function rataStats(it){
  const list=(compute().byItem[it.id]||[]).filter(o=>!o.orphan);
  const paid=list.filter(o=>o.status==="paid");const rest=list.filter(unpaid);
  const total=sum(list);const paidAmt=sum(paid);
  const next=rest[0]||null;const last=list.length?list[list.length-1].date:null;
  return{count:list.length,paidN:paid.length,restN:rest.length,paidAmt,restAmt:total-paidAmt,total,next,last,pct:list.length?paid.length/list.length:0};
}
function subStats(it){
  const list=(compute().byItem[it.id]||[]);const y=TODAY.slice(0,4);
  const next=list.find(o=>unpaid(o))||null;
  const spentYear=sum(list.filter(o=>o.status==="paid"&&o.date.slice(0,4)===y));
  const m=monthlyEq(it);return{monthly:m,yearly:m*12,next,spentYear};
}
const activeRate=()=>S.items.filter(it=>isRata(it)&&it.status==="attiva"&&rataStats(it).restN>0);

function insights(){
  const out=[];const mk=monthKey(TODAY);const prev=monthKey(addMonths(mk+"-01",-1));
  const mt=sum(compute().occ.filter(o=>monthKey(o.date)===mk)),pt=sum(compute().occ.filter(o=>monthKey(o.date)===prev));
  const d=mt-pt;
  if(Math.abs(d)>=1)out.push({i:"trend",t:`Questo mese hai <strong>${money(Math.abs(d))}</strong> ${d>0?"in più":"in meno"} di impegni rispetto al mese scorso.`});
  const subs=activeSubs("sub");const sm=subs.reduce((s,it)=>s+monthlyEq(it),0);
  if(subs.length)out.push({i:"sub",t:`Hai <strong>${subs.length} subscription attive</strong> per un costo di ${money(sm)} al mese.`});
  const ending=activeRate().map(it=>({it,st:rataStats(it)})).filter(x=>x.st.last&&x.st.last>=TODAY).sort((a,b)=>a.st.last<b.st.last?-1:1)[0];
  if(ending){const dd=diffDays(TODAY,ending.st.last);out.push({i:"flag",t:dd<=120?`Tra <strong>${dd} giorni</strong> terminerà la rata “${esc(ending.it.name)}”.`:`La prima rata a terminare è “${esc(ending.it.name)}”, a ${fmtDate(ending.st.last,{year:true})} (mancano ${ending.st.restN} rate).`})}
  out.push({i:"clock",t:`Nei prossimi 30 giorni dovrai pagare <strong>${money(sum(upcoming(30)))}</strong>.`});
  const all=S.items.filter(it=>!inactive(it)&&!(isRata(it)&&(it.status==="completata"||rataStats(it).restN===0)));
  const tot=all.reduce((s,it)=>s+monthlyEq(it),0);
  if(tot>0&&sm>0)out.push({i:"pie",t:`Le tue subscription rappresentano il <strong>${Math.round(sm/tot*100)}%</strong> dei tuoi impegni mensili.`});
  return out;
}

const kindColor=k=>`var(--c-${k})`;
function chip(o){return `<button class="chip ${o.status}" style="background:var(--c-${o.kind}-soft);color:var(--c-${o.kind})" data-act="occ" data-key="${esc(o.key)}" title="${esc(o.name)} — ${money(o.amount,o.currency)} · ${STATUS[o.status]}"><span class="cn">${esc(o.name)}</span><span class="ca">${moneyR(o.amount)}</span></button>`}
function vCalendar(){
  const cal=UI.cal;const p=parse(cal.cursor);const ws=+S.settings.weekStart;
  let title,body;
  const byDate={};for(const o of compute().occ)(byDate[o.date]=byDate[o.date]||[]).push(o);
  if(cal.mode==="month"){
    title=`${MONTHS[p.m-1]} ${p.y}`;
    const first=iso(p.y,p.m,1);const off=(dow(first)-ws+7)%7;const start=addDays(first,-off);
    let cells="";for(let i=0;i<7;i++)cells+=`<div class="wd">${WD[(ws+i)%7]}</div>`;
    for(let i=0;i<42;i++){const d=addDays(start,i);const dp=parse(d);const l=byDate[d]||[];
      if(i>=35&&dp.m!==p.m)break;
      cells+=`<div class="cell ${dp.m!==p.m?"out":""} ${d===TODAY?"today":""} ${d===cal.sel?"sel":""}" data-act="selDay" data-d="${d}" role="button" tabindex="0" aria-label="${fmtDate(d,{year:true})}, ${l.length} scadenze">
        <span class="dn">${dp.d}</span>${l.slice(0,3).map(chip).join("")}${l.length>3?`<span class="more">+${l.length-3} altri</span>`:""}
        <span class="dots">${l.slice(0,5).map(o=>`<i style="background:${o.status==="overdue"||o.status==="late"?"var(--s-over)":o.status==="paid"?"var(--s-paid)":kindColor(o.kind)}"></i>`).join("")}</span>
        ${l.length?`<span class="daytot">${moneyR(sum(l))}</span>`:""}</div>`}
    const selL=byDate[cal.sel]||[];
    body=`<div class="month">${cells}</div>
     <div class="panel"><div class="panel-h"><h2>${cal.sel===TODAY?"Oggi, ":""}${fmtDate(cal.sel,{year:true})}</h2><span class="amt">${selL.length?money(sum(selL)):""}</span></div>

function filteredPayments(){
  const f=UI.pf;const q=f.q.trim().toLowerCase();
  return compute().occ.filter(o=>{
    if(f.tab==="futuri"&&!(unpaid(o)&&o.date>=TODAY))return false;
    if(f.tab==="effettuati"&&o.status!=="paid")return false;
    if(f.tab==="scaduti"&&!(o.status==="overdue"||o.status==="late"))return false;
    if(f.tab!=="scaduti"){if(f.from&&o.date<f.from)return false;if(f.to&&o.date>f.to)return false}
    if(f.kind&&o.kind!==f.kind)return false;if(f.cat&&o.category!==f.cat)return false;if(f.method&&o.method!==f.method)return false;
    if(f.status&&o.status!==f.status)return false;
    if(f.min!==""&&o.amount<+f.min)return false;if(f.max!==""&&o.amount>+f.max)return false;
    if(q&&!(o.name+" "+(o.category||"")+" "+(o.method||"")).toLowerCase().includes(q))return false;
    return true;});
}

function incomeChart(rows){

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
function barChart(data){
  const W=900,H=300,L=56,R=12,T=16,B=40;const max=niceMax(Math.max(...data.map(d=>d.rata+d.sub+d.altro)));
  const cw=(W-L-R)/data.length,bw=Math.min(30,cw*.58);const y=v=>T+(H-T-B)*(1-v/max);const cm=monthKey(TODAY);
  let g="";for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${moneyR(v)}</text>`}
  let bars="";data.forEach((d,i)=>{const x=L+i*cw+(cw-bw)/2;let base=0;const fut=d.k>cm;
    for(const k of["rata","sub","altro"]){const v=d[k];if(v<=0)continue;const y1=y(base+v),h=y(base)-y1;bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0,h-1)}" rx="3" fill="var(--c-${k})" opacity="${fut?.5:1}"><title>${monthLabel(d.k)} · ${KIND[k].pl}: ${money(v)}</title></rect>`;base+=v}
    const tot=d.rata+d.sub+d.altro;const mm=+d.k.slice(5);
    bars+=`<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="${d.k===cm?"var(--ink)":"var(--muted)"}" font-weight="${d.k===cm?700:400}">${MSHORT[mm-1]}</text>`;
    if(mm===1||i===0)bars+=`<text x="${x+bw/2}" y="${H-B+30}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.k.slice(0,4)}</text>`;
    if(d.k===cm&&tot>0)bars+=`<text x="${x+bw/2}" y="${y(tot)-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${moneyR(tot)}</text>`;});
  const ci=data.findIndex(d=>d.k===cm);const sx=L+ci*cw+cw;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico impegni mensili">${g}<line x1="${sx}" x2="${sx}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>${bars}</svg>`;
}
function donut(parts){
  const tot=parts.reduce((s,p)=>s+p[1],0);const r=62,c=2*Math.PI*r;let off=0;
  const segs=tot>0?parts.filter(p=>p[1]>0).map(p=>{const len=p[1]/tot*c;const s=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--c-${p[2]})" stroke-width="22" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`;off+=len;return s}).join(""):"";
  return `<div class="donut-wrap"><svg viewBox="0 0 170 170" role="img" aria-label="Distribuzione impegni"><circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="22"/>${segs}
    <text x="85" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, Figtree, sans-serif">${moneyR(tot)}</text><text x="85" y="101" text-anchor="middle" font-size="11" fill="var(--muted)">al mese</text></svg>
    <div class="dleg">${parts.map(p=>`<div><i style="background:var(--c-${p[2]})"></i>${p[0]}<b>${tot?Math.round(p[1]/tot*100):0}%</b></div>`).join("")}</div></div>`;
}

    else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=""}else if(ch==="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell=""}else cell+=ch}

function doImport(type){

    const[a,b]=await Promise.all([
      sb.from("wishlist_items").select("*").order("created_at",{ascending:false}),
      sb.from("wishlist_price_history").select("item_id,price,sale_price,recorded_at").order("recorded_at",{ascending:true})]);
    if(a.error||b.error)throw(a.error||b.error);
    W.items=a.data.map(r=>Object.assign(r,{price:nOrNull(r.price),sale_price:nOrNull(r.sale_price),discount:nOrNull(r.discount),discount_pct:nOrNull(r.discount_pct)}));
    W.hist={};for(const r of b.data)(W.hist[r.item_id]||(W.hist[r.item_id]=[])).push({price:nOrNull(r.price),sale_price:nOrNull(r.sale_price),recorded_at:r.recorded_at});
    W.loaded=true;W.err="";
  }catch(e){W.err=netErr(e)?"Connessione assente: riprova tra poco.":(e.message||"Errore nel caricamento");if(!silent)toast(W.err)}
  finally{W.loading=false;if(UI.view==="wishlist")render()}
}

// variazione: ultimo prezzo registrato rispetto al precedente
function wVar(it){
  const h=W.hist[it.id]||[];if(h.length<2)return null;
  const cur=wEff(h[h.length-1]),prev=wEff(h[h.length-2]);if(cur==null||prev==null)return null;
  const diff=Math.round((cur-prev)*100)/100;return{diff,pct:prev?diff/prev*100:0,prev};
}
function wSpark(it){
  const pts=(W.hist[it.id]||[]).map(wEff).filter(v=>v!=null);if(pts.length<2)return"";
  const w=240,h=26,min=Math.min(...pts),max=Math.max(...pts),sp=max-min||1;
  const d=pts.map((v,i)=>`${(i/(pts.length-1)*(w-4)+2).toFixed(1)},${(h-3-(v-min)/sp*(h-6)).toFixed(1)}`).join(" ");
  return `<svg class="wl-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(${pts[pts.length-1]<=pts[0]?"--s-paid":"--s-over"})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function wCountdown(){
  const d=diffDays(TODAY,BF_DATE);
  if(d>1)return{v:`${d}<small> giorni</small>`,s:`al Black Friday, ${fmtDate(BF_DATE)}`};
  if(d===1)return{v:"Domani",s:"inizia il Black Friday"};
  if(TODAY<=BF_LAST)return{v:"Ci siamo",s:`sconti fino al Cyber Monday, ${fmtDate(BF_LAST)}`};
  return{v:"Concluso",s:"Black Friday 2026"};
}

function wSay(t,cls){const m=document.getElementById("wMsg");if(!m)return;m.textContent=t;m.className="wl-msg "+(cls||"");m.hidden=!t}

async function wFetch(url){
  // sempre in Irlanda (UE, euro): dalla regione più vicina all'Italia (Zurigo) alcuni negozi mostrano i prezzi svizzeri
  const{data,error}=await sb.functions.invoke("wishlist-scrape",{body:{url},headers:{"x-region":"eu-west-1"}});
  if(error){let m="Non sono riuscito a leggere la pagina";try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(x){}throw new Error(m)}
  return data||{};
}
async function wScrape(){
  const url=safeUrl(document.getElementById("w_url").value);
  if(!url){wSay("Incolla prima un link valido (deve iniziare con https://).","err");return}
  const b=document.getElementById("wScrapeBtn");b.disabled=true;b.textContent="Leggo…";wSay("");
  try{
    const d=await wFetch(url);W.lastScrape={url,price:null};const set=(id,v)=>{const n=document.getElementById(id);if(n&&v&&!n.value.trim())n.value=v};
    if(d.image)document.getElementById("w_img").value=d.image;
    set("w_title",d.title&&d.title.slice(0,200));set("w_desc",d.description);set("w_store",d.store);
    const amzLink=isAmz(url);
    if(amzLink){d.price=null;d.note=null}
    W.lastScrape.price=d.price!=null?d.price:null;
    if(d.price!=null){const P=document.getElementById("w_price"),S=document.getElementById("w_sale"),p=wNum(P.value);
      // Amazon: se c'è un prezzo consigliato più alto, quello è il prezzo pieno e il prezzo attuale è lo scontato
      if(d.listPrice!=null&&d.listPrice>d.price&&p==null){P.value=wIn(d.listPrice);S.value=wIn(d.price);wCalc("w_sale")}
      else if(p!=null&&d.price<p){S.value=wIn(d.price);wCalc("w_sale")}
      else if(p==null){P.value=wIn(d.price);wCalc("w_price")}}
    wPreview();
    const got=[d.image&&"foto",d.title&&"nome",d.price!=null&&(d.amazonSeller?"prezzo di Amazon.it":"prezzo")].filter(Boolean);
    if(amzLink)wSay((got.length?`Trovato: ${got.join(", ")}. `:"")+"Su Amazon il prezzo lo inserisci tu: guarda quello venduto da Amazon.it.","ok");
    else if(d.note)wSay((got.length?`Trovato: ${got.join(", ")}. `:"")+d.note,"err");
    else wSay(got.length?`Trovato: ${got.join(", ")}. Controlla e salva.`:"Il negozio non mostra i dati: compilali a mano.",got.length?"ok":"err");
  }catch(e){wSay(e.message+": puoi compilare a mano.","err")}
  finally{b.disabled=false;b.textContent="Leggi dal link"}
}
async function saveWish(form){
  const fd=new FormData(form),g=k=>(fd.get(k)||"").toString().trim();
  const err=m=>{const e=document.getElementById("wErr");e.textContent=m;e.hidden=false};
  const id=g("wid"),prev=id?wFind(id):null;
  if(!g("title"))return err("Inserisci il nome del prodotto.");
  const price=wNum(g("price")),sale=wNum(g("sale_price"));
  if(g("price")&&price==null)return err("Prezzo pieno non valido, scrivi ad esempio 129,99.");
  if(g("sale_price")&&sale==null)return err("Prezzo scontato non valido, scrivi ad esempio 99,99.");
  if(price!=null&&sale!=null&&sale>price)return err("Il prezzo scontato è più alto del prezzo pieno.");
  if(g("url")&&!safeUrl(g("url")))return err("Il link deve iniziare con https://");
  const row={title:g("title"),description:g("description")||null,url:safeUrl(g("url")),image_url:safeUrl(g("image_url")),store:g("store")||null,
    category:g("category")||null,priority:+g("priority")||2,price,sale_price:sale};
  if(prev){row.purchased=!!fd.get("purchased");if(!row.purchased)row.rata_id=null}
  // automatico se il prezzo salvato è quello letto dal sito; se non lo hai cambiato resta com'era
  const ls=W.lastScrape;
  if(!row.url||isAmz(row.url))row.price_source="manual";
  else if(ls&&ls.url===row.url)row.price_source=ls.price!=null&&(sale===ls.price||price===ls.price)?"auto":"manual";
  else if(prev&&prev.price===price&&prev.sale_price===sale&&prev.url===row.url)row.price_source=prev.price_source||null;
  else row.price_source="manual";   // prezzo scritto a mano: con ↻ si può riprovare a leggerlo dal sito
  const btn=document.getElementById("wSave");btn.disabled=true;
  const{error}=prev?await sb.from("wishlist_items").update(row).eq("id",prev.id):await sb.from("wishlist_items").insert(row);
  btn.disabled=false;
  if(error)return err(netErr(error)?"Connessione assente: riprova.":error.message);
  closeModal();toast(prev?"Modifiche salvate":`${row.title} aggiunto alla wishlist`);loadWish();
}
