  const pts=h.map(r=>wEff(r)).filter(v=>v!=null);let chart;
  if(pts.length<2)chart=`<p class="muted" style="margin:0;font-size:13.5px">Il grafico compare dal primo cambio di prezzo. Usa ${ico("refresh")} sulla scheda per ricontrollarlo dal sito.</p>`;
  else{const Wd=600,H=170,L=56,R=14,T=14,B=26,min=Math.min(...pts),max=Math.max(...pts),sp=max-min||1;
    const x=k=>L+k/(pts.length-1)*(Wd-L-R),y=v=>T+(H-T-B)*(1-(v-min)/sp);
    chart=`<svg class="wl-chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Andamento del prezzo">
      <line x1="${L}" x2="${Wd-R}" y1="${y(max)}" y2="${y(max)}" stroke="var(--line)"/><line x1="${L}" x2="${Wd-R}" y1="${y(min)}" y2="${y(min)}" stroke="var(--line)"/>
      <text x="${L-8}" y="${y(max)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${moneyR(max)}</text><text x="${L-8}" y="${y(min)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${moneyR(min)}</text>
      <polyline points="${pts.map((v,k)=>x(k)+","+y(v)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      ${pts.map((v,k)=>`<circle cx="${x(k)}" cy="${y(v)}" r="3.5" fill="var(--accent)"><title>${money(v)}</title></circle>`).join("")}</svg>`}
  const rows=h.slice().reverse().map((r,k,a)=>{const nx=a[k+1];const c=wEff(r),p=nx?wEff(nx):null;let v="—";
    if(c!=null&&p!=null){const d=Math.round((c-p)*100)/100;v=d===0?"=":`<span class="wl-var ${d<0?"down":"up"}">${d<0?"▼":"▲"} ${money(Math.abs(d))}</span>`}
    const t=new Date(r.recorded_at);
    return `<tr><td>${t.getDate()} ${MSHORT[t.getMonth()]} ${t.getFullYear()!==+TODAY.slice(0,4)?t.getFullYear()+" ":""}${pad(t.getHours())}:${pad(t.getMinutes())}</td><td class="num">${r.price!=null?money(r.price):"—"}</td><td class="num">${r.sale_price!=null?money(r.sale_price):"—"}</td><td class="num">${v}</td></tr>`}).join("");
  openModal(`${mHead("Storico prezzi")}<div class="m-body"><p style="margin:0;font-weight:600">${esc(i.title)}</p>${chart}
    <div style="overflow:auto"><table class="inc" style="width:100%"><thead><tr><th>Data</th><th style="text-align:right">Pieno</th><th style="text-align:right">Scontato</th><th style="text-align:right">Variazione</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="4" class="muted">Nessun dato</td></tr>`}</tbody></table></div></div>
    <div class="m-foot"><button class="btn" data-act="close">Chiudi</button></div>`,true);
}

/* ---------- ricontrolla prezzo dal sito ---------- */
async function wCheck(i,quiet){
  if(!i||!i.url||isAmz(i.url))return"skip";
  try{
    const d=await wFetch(i.url);
    if(d.price==null){
      // il sito non dà il prezzo: diventa manuale
      if(i.price_source!=="manual"){await sb.from("wishlist_items").update({price_source:"manual"}).eq("id",i.id);i.price_source="manual";if(UI.view==="wishlist")render()}
      if(!quiet)toast((d.note||"Prezzo non trovato sul sito")+" Usa «€ Prezzo» per inserirlo a mano.");
      return"nf";
    }
    const upd={};if(!i.image_url&&d.image)upd.image_url=d.image;const cur=wEff(i);
    if(d.price!==cur){
      // sotto al prezzo pieno = prezzo scontato; uguale o sopra = nuovo prezzo pieno, senza sconto
      if(i.price==null||d.price>=i.price){upd.price=d.price;upd.sale_price=null}else upd.sale_price=d.price}
    if(i.price_source!=="auto")upd.price_source="auto";
    const changed=upd.price!==undefined||upd.sale_price!==undefined;
    if(Object.keys(upd).length){const{error}=await sb.from("wishlist_items").update(upd).eq("id",i.id);if(error)throw error}
    if(!quiet){toast(!changed?"Prezzo invariato: "+money(cur):cur!=null&&d.price<cur?`Sceso a ${money(d.price)}!`:`Nuovo prezzo: ${money(d.price)}`);loadWish(true)}
    return changed?"changed":"same";
  }catch(e){if(!quiet)toast(e.message||"Errore");return"err"}
}
async function wRefreshAll(){
  const amz=W.items.filter(i=>i.url&&!i.purchased&&isAmz(i.url)).length;
  const list=W.items.filter(i=>i.url&&!i.purchased&&!isAmz(i.url));if(!list.length){toast(amz?"I prodotti Amazon si aggiornano a mano con il pulsante €":"Nessun prodotto con link da controllare");return}
  if(W.busy)return;W.busy=true;render();let n=0,ch=0;
  for(const i of list){const l=document.getElementById("wRefLbl");if(l)l.textContent=`${++n} di ${list.length}…`;if(await wCheck(i,true)==="changed")ch++}
  W.busy=false;toast((ch?(ch===1?"1 prezzo aggiornato":`${ch} prezzi aggiornati`):"Nessun cambio di prezzo")+(amz?` · ${amz} Amazon da aggiornare a mano`:""));loadWish(true);
}

/* ---------- aggiornamento manuale del prezzo (Amazon) ---------- */
function openWishManual(id){const i=wFind(id);if(!i)return;const link=safeUrl(i.url);
  openModal(`${mHead("Aggiorna prezzo")}<form id="wManualForm" novalidate><div class="m-body">
    <p style="margin:0;font-weight:600">${esc(i.title)}</p>
    <p class="muted" style="margin:0;font-size:13.5px">Apri la pagina, guarda il prezzo <b>venduto da Amazon.it</b> e scrivilo qui. Finisce nello storico come gli altri.</p>
    ${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${ico("ext")} Apri su Amazon</a>`:""}
    <div class="fgrid">
      <div class="field"><label for="wm_now">Prezzo attuale</label><input type="text" inputmode="decimal" id="wm_now" value="${wIn(wEff(i))}" placeholder="0,00" autofocus></div>
      <div class="field"><label for="wm_full">Prezzo pieno</label><input type="text" inputmode="decimal" id="wm_full" value="${wIn(i.price)}" placeholder="0,00"><span class="hint">Il prezzo barrato / consigliato, se c'è</span></div>
    </div><div class="err" id="wmErr" hidden></div></div>
    <div class="m-foot"><button type="button" class="btn ghost" data-act="close">Annulla</button><button type="submit" class="btn primary">Salva prezzo</button></div>
    <input type="hidden" id="wm_id" value="${id}"></form>`);
  const n=document.getElementById("wm_now");if(n){n.focus();n.select()}}
async function saveWishManual(){
  const i=wFind(document.getElementById("wm_id").value);if(!i)return;
  const err=m=>{const e=document.getElementById("wmErr");e.textContent=m;e.hidden=false};
  const nowV=document.getElementById("wm_now").value.trim(),fullV=document.getElementById("wm_full").value.trim();
  const now=wNum(nowV),full=fullV?wNum(fullV):null;
  if(now==null||now<=0)return err("Scrivi il prezzo attuale, ad esempio 89,99.");
  if(fullV&&full==null)return err("Prezzo pieno non valido.");
  // con prezzo pieno più alto: quello attuale è lo scontato; altrimenti è il nuovo prezzo pieno
  const keepFull=full==null&&i.price!=null&&i.price>now;
  const upd=full!=null&&full>now?{price:full,sale_price:now}:keepFull?{price:i.price,sale_price:now}:{price:now,sale_price:null};
  upd.price_source="manual";
  const{error}=await sb.from("wishlist_items").update(upd).eq("id",i.id);
  if(error)return err(netErr(error)?"Connessione assente: riprova.":error.message);
  const before=wEff(i);closeModal();
  toast(before!=null&&now<before?`Sceso a ${money(now)}!`:before!=null&&now>before?`Salito a ${money(now)}`:"Prezzo salvato");loadWish(true);
}

/* ---------- comprato: a rate o pagato subito ---------- */
function openWishBuy(id){const i=wFind(id);if(!i)return;const p=wEff(i);
  openModal(`${mHead("Hai comprato “"+esc(i.title)+"”?")}<div class="m-body"><div class="wl-buy">
    <button data-act="wBuyRate" data-id="${id}">${ico("rate")}<span>L'ho preso a rate<span>Si apre una nuova rata già compilata${p!=null?` con ${money(p)}`:""}: scegli numero di rate e data della prima.</span></span></button>
    <button data-act="wBuyPaid" data-id="${id}">${ico("check")}<span>L'ho pagato tutto subito<span>Il prodotto viene segnato come comprato.</span></span></button></div></div>
    <div class="m-foot"><button class="btn ghost" data-act="close">Annulla</button></div>`)}
function wBuyRate(id){
  const i=wFind(id);if(!i)return;openForm("rata");
  const f=document.getElementById("itemForm");if(!f)return;
  f.querySelector("[name=name]").value=i.title.slice(0,60);
  if(wEff(i)!=null)f.querySelector("[name=amount]").value=wIn(wEff(i));
  const host=(i.store||i.url||"").toLowerCase();const via=/amazon/.test(host)?"amazon":/paypal/.test(host)?"paypal":"";
  const r=f.querySelector(`[name=via][value="${via}"]`);if(r)r.checked=true;
  const h=document.createElement("input");h.type="hidden";h.name="wishId";h.value=id;f.appendChild(h);
  const note=document.createElement("div");note.className="wl-from";note.innerHTML=`${ico("gift")}<span>Dalla wishlist: quando salvi la rata, il prodotto viene segnato come comprato.</span>`;
  f.querySelector(".m-body").prepend(note);
  const kp=f.querySelector(".kind-pick");if(kp)kp.remove();   // si crea per forza una rata
  ratePreview();const t=f.querySelector("[name=total]");if(t){t.focus();t.select()}
}
async function wMarkBought(id,rataId){
  const upd={purchased:true};if(rataId)upd.rata_id=rataId;
  const{error}=await sb.from("wishlist_items").update(upd).eq("id",id);
  if(error){toast("Rata salvata, ma non sono riuscito ad aggiornare la wishlist: "+(netErr(error)?"connessione assente":error.message));return false}
  const i=wFind(id);if(i)Object.assign(i,upd);if(UI.view==="wishlist")render();return true;
}
async function wBuyPaid(id){closeModal();if(await wMarkBought(id))toast("Segnato come comprato")}

/* ================= eventi ================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="scrim"){if(e.target===b)closeModal();return}
  switch(a){
    case"nav":UI.view=b.dataset.v;if(b.dataset.tab){UI.pf.tab=b.dataset.tab}else if(UI.view==="payments"){UI.pf.tab="tutti"}closeModal();UI.search="";render();window.scrollTo(0,0);if(UI.view==="payments")jumpToday();break;
    case"add":if(UI.view==="wishlist"&&!b.dataset.kind&&wOn()){openWishForm();break}openForm(b.dataset.kind||(UI.view==="rate"?"rata":"sub"));break;
    case"wAdd":openWishForm();break;case"wEdit":openWishForm(b.dataset.id);break;case"wHist":openWishHist(b.dataset.id);break;
    case"wScrape":wScrape();break;case"wAskDel":wAskDel(b.dataset.id);break;case"wDoDel":wDoDel(b.dataset.id);break;
    case"wCat":W.cat=b.dataset.v||"";render();requestAnimationFrame(()=>{const t=document.querySelector(".wl-tab.on");if(t)t.scrollIntoView({block:"nearest",inline:"center"})});break;
    case"wManual":openWishManual(b.dataset.id);break;
    case"wCheck":{const i=wFind(b.dataset.id);b.disabled=true;b.classList.add("spin");wCheck(i).finally(()=>{b.disabled=false;b.classList.remove("spin")});break}
    case"wRefreshAll":wRefreshAll();break;case"wReload":W.err="";render();break;
    case"wBuy":openWishBuy(b.dataset.id);break;case"wBuyRate":wBuyRate(b.dataset.id);break;case"wBuyPaid":wBuyPaid(b.dataset.id);break;
    case"wRata":if(S.items.some(x=>x.id===b.dataset.id)){UI.view="rate";render();window.scrollTo(0,0);openForm(null,b.dataset.id)}break;
    case"pickKind":openForm(b.dataset.v);break;
    case"edit":UI.search="";renderTop();openForm(null,b.dataset.id);break;
    case"occ":UI.search="";renderTop();openOcc(b.dataset.key);break;
    case"close":closeModal();break;
    case"setStatus":closeModal();setStatus(b.dataset.key,b.dataset.v);break;
    case"pause":openPause(b.dataset.id);break;case"doPause":doPause(b.dataset.id);break;case"resume":resume(b.dataset.id);break;case"doResume":doResume(b.dataset.id);break;
    case"askDelete":askDelete(b.dataset.id);break;
    case"doDelete":{const id=b.dataset.id;const it=S.items.find(x=>x.id===id);S.items=S.items.filter(x=>x.id!==id);for(const k in S.payments)if(S.payments[k].itemId===id)delete S.payments[k];closeModal();commit(`${it?it.name:"Elemento"} eliminato`);break}
    case"emoji":document.getElementById("f_emoji").value=b.dataset.v;break;
    case"more":openMore();break;
    case"bell":openBell();break;
    case"toggleSearch":UI.searchOpen=!UI.searchOpen;renderTop();if(UI.searchOpen)document.getElementById("gsearch").focus();break;
    case"subTab":UI.subTab=b.dataset.v;render();break;
    case"calMode":UI.cal.mode=b.dataset.v;UI.cal.cursor=UI.cal.sel;render();break;
    case"calToday":UI.cal.cursor=TODAY;UI.cal.sel=TODAY;render();break;
    case"calNav":{const n=+b.dataset.v;const m=UI.cal.mode;UI.cal.cursor=m==="month"?addMonths(UI.cal.cursor.slice(0,8)+"01",n):addDays(UI.cal.cursor,m==="week"?7*n:n);if(m==="month"){UI.cal.sel=monthKey(UI.cal.cursor)===monthKey(TODAY)?TODAY:UI.cal.cursor}else UI.cal.sel=UI.cal.cursor;render();break}
    case"selDay":if(e.target.closest(".chip"))return;UI.cal.sel=b.dataset.d;if(window.matchMedia("(max-width:900px)").matches||true){render()}break;
    case"upRange":S.settings.upRange=b.dataset.v;commit();break;
    case"incMonth":if(e.target.closest("input"))return;openIncMonth(b.dataset.k);break;
    case"incYear":UI.incYear+=+b.dataset.v;render();break;
    case"pTab":UI.pf.tab=b.dataset.v;render();if(b.dataset.v==="tutti")jumpToday();else window.scrollTo(0,0);break;
    case"toggleFilters":UI.showFilters=!UI.showFilters;render();break;
    case"resetFilters":UI.pf=Object.assign(UI.pf,{q:"",from:"",to:addMonths(TODAY,6),kind:"",cat:"",status:"",method:"",min:"",max:""});render();break;
    case"goPayments":UI.view="payments";UI.pf.tab="futuri";UI.pf.from=TODAY;UI.pf.to=addDays(TODAY,+b.dataset.days);render();window.scrollTo(0,0);break;
    case"delCat":S.customCats.splice(+b.dataset.i,1);commit("Categoria rimossa");break;
    case"delMethod":if(S.methods.length<=1){toast("Serve almeno un metodo di pagamento");break}S.methods.splice(+b.dataset.i,1);commit("Metodo rimosso");break;
    case"exportJSON":offerFile(`track-your-payments-backup-${TODAY}.json`,JSON.stringify(S,null,2),"Backup JSON");break;
    case"exportCSV":offerFile(`track-your-payments-pagamenti-${TODAY}.csv`,paymentsCSV(),"Pagamenti CSV");break;
    case"exportItemsCSV":offerFile(`track-your-payments-elenco-${TODAY}.csv`,itemsCSV(),"Rate e subscription CSV");break;
    case"importCSV":openImport("csv");break;case"importJSON":openImport("json");break;case"doImport":doImport(b.dataset.v);break;
    case"copyExport":{const t=document.getElementById("exportText");const done=()=>toast("Copiato negli appunti");try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast("Testo selezionato: copialo con Ctrl/Cmd+C")})}catch(x){t.select()}break}
    case"logout":doLogout();break;
    case"delDemo":confirmBox("Eliminare i dati demo?","Gli elementi di esempio e i relativi pagamenti verranno rimossi. Quelli che hai aggiunto o modificato restano.","doDelDemo","Elimina dati demo");break;
    case"doDelDemo":{const ids=new Set(S.items.filter(i=>i.demo).map(i=>i.id));S.items=S.items.filter(i=>!i.demo);for(const k in S.payments)if(ids.has(S.payments[k].itemId))delete S.payments[k];S.demo=false;closeModal();commit("Dati demo eliminati");break}
    case"loadDemo":{const d=demoState();S.items=S.items.concat(d.items);commit("Dati demo caricati");break}
    case"resetAll":confirmBox("Cancellare tutto?","Tutte le rate, le subscription e lo storico dei pagamenti verranno eliminati. Esporta un backup prima, se ti serve.","doReset","Cancella tutto");break;
    case"doReset":{const s=S.settings,m=S.methods,c=S.customCats;S=blankState();S.settings=s;S.methods=m;S.customCats=c;closeModal();commit("Dati cancellati");break}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(document.querySelector(".scrim"))closeModal();else if(UI.search){UI.search="";renderTop()}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".cell")){e.preventDefault();e.target.click()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="gsearch"){UI.search=t.value;renderResults();return}
  if(t.id==="w_price"||t.id==="w_sale"||t.id==="w_pct"){wCalc(t.id);return}
  if(t.id==="w_img"){wPreview();return}
  if(t.id==="w_q"){W.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById("w_q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return}
  if(t.dataset.prev||t.id==="f_cd"){ratePreview();return}
  if(t.dataset.pf&&(t.type==="search"||t.type==="number")){UI.pf[t.dataset.pf]=t.value;const pos=t.selectionStart;const id=t.id;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.income){const v=t.value.trim();const n=numIn(v);const err=v&&!(n>=0);
    if(err){toast("Importo non valido: scrivi ad esempio 1850 o 1.850,50");return}
    if(!v)delete S.income[t.dataset.income];else S.income[t.dataset.income]=Math.round(n*100)/100;
    setTimeout(()=>commit(),0);return}
  if(t.dataset.wf&&t.id!=="w_q"){W[t.dataset.wf]=t.type==="checkbox"?t.checked:t.value;render();return}
  if(t.dataset.change==="status"){setStatus(t.dataset.key,t.value);return}
  if(t.dataset.change==="freq"){document.getElementById("customWrap").hidden=t.value!=="custom";ratePreview();return}
  if(t.dataset.pf&&t.type!=="search"&&t.type!=="number"){UI.pf[t.dataset.pf]=t.value;render();return}
  if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==="checkbox"?t.checked:(["weekStart","remindDefault"].includes(k)?+t.value:t.value);if(k==="theme")applyTheme();commit("Impostazioni salvate")}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.getAttribute("id")==="itemForm"){saveForm(f);return}
  if(f.getAttribute("id")==="wishForm"){saveWish(f);return}
  if(f.getAttribute("id")==="wManualForm"){saveWishManual();return}
  if(f.dataset.form==="incOne"){const n=numIn(document.getElementById("incOneVal").value);if(!(n>=0)){toast("Inserisci un importo, ad esempio 1850");return}
    S.income[f.dataset.k]=Math.round(n*100)/100;commit("Stipendio salvato");openIncMonth(f.dataset.k);return}
  if(f.dataset.form==="incFill"){const n=numIn(document.getElementById("incFillVal").value);if(!(n>0)){toast("Inserisci un importo, ad esempio 1850");return}
    let k=0;for(let m=1;m<=12;m++){const key=`${UI.incYear}-${pad(m)}`;if(S.income[key]==null){S.income[key]=Math.round(n*100)/100;k++}}
    commit(k?`Stipendio inserito in ${k} mesi`:"Tutti i mesi hanno già uno stipendio");return}
  if(f.dataset.form==="cat"){const v=document.getElementById("newCat").value.trim();if(!v)return;if(allCats().some(c=>c.toLowerCase()===v.toLowerCase())){toast("Categoria già presente");return}S.customCats.push(v);commit("Categoria aggiunta")}
  if(f.dataset.form==="method"){const v=document.getElementById("newMethod").value.trim();if(!v)return;if(/\d{6,}/.test(v.replace(/[\s-]/g,""))){toast("Non inserire numeri di carta o conto: usa solo un nome");return}if(S.methods.includes(v)){toast("Metodo già presente");return}S.methods.push(v);commit("Metodo aggiunto")}
});
document.addEventListener("click",e=>{if(UI.search&&!e.target.closest("#searchBox")){UI.search="";const i=document.getElementById("gsearch");if(i)i.value="";renderResults()}},true);

document.addEventListener("error",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.wimg){const s=document.createElement("span");s.className="wl-ph";s.innerHTML=ico("gift");t.replaceWith(s)}},true);
/* ================= avvio ================= */
S=normalize(lsGet()||blankState());
applyTheme();
startAuth();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
